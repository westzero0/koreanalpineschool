<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>등반 교육생 채점 및 관리 시스템</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // 초기 샘플 그룹 및 강사
    const INITIAL_GROUPS = ['A조', 'B조', 'C조'];
    
    // 신규 채점 체계 구조 정의
    const EVAL_STRUCTURE = {
      climbing: {
        title: '🧗 1. 등반',
        subFields: [
          { key: 'beltKnot', label: '벨트매듭', type: 'PF' },
          { key: 'footWork', label: '발사용', type: 'HML' },
          { key: 'handWork', label: '손사용', type: 'HML' },
          { key: 'stability', label: '안정성', type: 'HML' },
          { key: 'composure', label: '여유', type: 'HML' },
          { key: 'overallPF', label: '종합', type: 'PF' },
        ],
        resultKey: 'climbingResult'
      },
      secondBelay: {
        title: '⚓ 2. 세컨 빌레이',
        subFields: [
          { key: 'anchorSetup', label: '지점 세팅', type: 'PF' },
          { key: 'deviceSetup', label: '설치', type: 'PF' },
          { key: 'ropePull', label: '줄당기기', type: 'PF' },
          { key: 'ropeManage', label: '로프정리', type: 'PF' },
          { key: 'lowering', label: '하강', type: 'PF' },
        ],
        resultKey: 'secondBelayResult'
      },
      leadBelay: {
        title: '🧗‍♂️ 3. 리딩빌레이',
        subFields: [
          { key: 'deviceSetup', label: '디바이스 설치', type: 'PF' },
          { key: 'shuffle', label: '셔플', type: 'PF' },
          { key: 'brakeHand', label: '제동손 위치', type: 'PF' },
          { key: 'stability', label: '안정성', type: 'HML' },
        ],
        resultKey: 'leadBelayResult'
      },
      rappelling: {
        title: '🪢 4. 하강',
        subFields: [
          { key: 'ropeSetup', label: '로프설치', type: 'PF' },
          { key: 'ropeFix', label: '로프고정', type: 'PF' },
          { key: 'harnessConnect', label: '체결', type: 'PF' },
          { key: 'stopCheck', label: '정지', type: 'PF' },
          { key: 'ascending', label: '어센딩', type: 'PF' },
          { key: 'proficiency', label: '능숙도', type: 'PF' },
        ],
        resultKey: 'rappellingResult'
      },
      walking: {
        title: '🥾 5. 보행',
        subFields: [],
        resultKey: 'walkingResult'
      }
    };

    // 샘플 교육생 데이터
    const INITIAL_STUDENTS = [
      { id: '1', name: '김등반', age: 34, team: 'A조', photo_url: '' },
      { id: '2', name: '이산악', age: 29, team: 'A조', photo_url: '' },
      { id: '3', name: '박바위', age: 41, team: 'B조', photo_url: '' },
      { id: '4', name: '최확보', age: 27, team: 'B조', photo_url: '' },
      { id: '5', name: '정하강', age: 38, team: 'C조', photo_url: '' },
      { id: '6', name: '한암벽', age: 31, team: '미정', photo_url: '' },
    ];

    function App() {
      // 상태 관리
      const [instructorName, setInstructorName] = useState(() => localStorage.getItem('instructorName') || '');
      const [isConfig, setIsConfig] = useState(!localStorage.getItem('instructorName'));
      const [tempName, setTempName] = useState('');
      const [activeTab, setActiveTab] = useState('myGroup'); // 'myGroup', 'allGroup', 'admin'
      
      const [groups, setGroups] = useState(() => JSON.parse(localStorage.getItem('groups')) || INITIAL_GROUPS);
      const [students, setStudents] = useState(() => JSON.parse(localStorage.getItem('students')) || INITIAL_STUDENTS);
      const [instructorList, setInstructorList] = useState(() => JSON.parse(localStorage.getItem('instructorList')) || [
        { name: '김강사', last_login: new Date().toISOString() },
        { name: '박강사', last_login: new Date().toISOString() }
      ]);

      // 담당 강사 설정 (조별)
      const [groupInstructors, setGroupInstructors] = useState(() => JSON.parse(localStorage.getItem('groupInstructors')) || {
        'A조': '김강사',
        'B조': '박강사',
        'C조': ''
      });

      // 평가 데이터: { [studentId]: { [instructorName]: { details: {}, results: {}, note: '' } } }
      const [evaluations, setEvaluations] = useState(() => JSON.parse(localStorage.getItem('evaluations')) || {});

      // 관리자 페이지 전용 편집 상태
      const [isAdminAuth, setIsAdminAuth] = useState(false);
      const [adminInput, setAdminInput] = useState('');
      const [editingGroups, setEditingGroups] = useState({});
      const [editingInstructors, setEditingInstructors] = useState({});
      const [editingStudentDetails, setEditingStudentDetails] = useState({});
      const [newGroupName, setNewGroupName] = useState('');

      // 모달 상태
      const [selectedStudent, setSelectedStudent] = useState(null);
      const [modalTab, setModalTab] = useState('myScore'); // 'myScore', 'allScores', 'survey'

      // 채점 폼 상태
      const [evalDetails, setEvalDetails] = useState({});
      const [evalResults, setEvalResults] = useState({
        climbingResult: 'M',
        secondBelayResult: 'M',
        leadBelayResult: 'M',
        rappellingResult: 'M',
        walkingResult: 'M'
      });
      const [evalNote, setEvalNote] = useState('');

      // 데이터 로컬스토리지 저장
      useEffect(() => {
        localStorage.setItem('groups', JSON.stringify(groups));
        localStorage.setItem('students', JSON.stringify(students));
        localStorage.setItem('groupInstructors', JSON.stringify(groupInstructors));
        localStorage.setItem('instructorList', JSON.stringify(instructorList));
        localStorage.setItem('evaluations', JSON.stringify(evaluations));
      }, [groups, students, groupInstructors, instructorList, evaluations]);

      // 강사 이름 설정
      const handleSaveInstructorName = () => {
        if (!tempName.trim()) return alert('성함을 입력해주세요.');
        const name = tempName.trim();
        setInstructorName(name);
        localStorage.setItem('instructorName', name);
        
        // 강사 목록에 추가
        if (!instructorList.some(i => i.name === name)) {
          setInstructorList([...instructorList, { name, last_login: new Date().toISOString() }]);
        }
        setIsConfig(false);
      };

      // 모달 열릴 때 기존 평가 불러오기
      const handleOpenStudentModal = (student) => {
        setSelectedStudent(student);
        setModalTab('myScore');

        const existingEv = evaluations[student.id]?.[instructorName];
        if (existingEv) {
          setEvalDetails(existingEv.details || {});
          setEvalResults(existingEv.results || {
            climbingResult: 'M',
            secondBelayResult: 'M',
            leadBelayResult: 'M',
            rappellingResult: 'M',
            walkingResult: 'M'
          });
          setEvalNote(existingEv.note || '');
        } else {
          setEvalDetails({});
          setEvalResults({
            climbingResult: 'M',
            secondBelayResult: 'M',
            leadBelayResult: 'M',
            rappellingResult: 'M',
            walkingResult: 'M'
          });
          setEvalNote('');
        }
      };

      // 세부 평가 선택 핸들러
      const handleSubFieldChange = (key, val) => {
        setEvalDetails(prev => ({ ...prev, [key]: val }));
      };

      // 최종 결과(H/M/L) 선택 핸들러
      const handleResultChange = (resKey, val) => {
        setEvalResults(prev => ({ ...prev, [resKey]: val }));
      };

      // 평가 저장
      const handleSaveEval = () => {
        if (!instructorName) {
          alert('강사 이름을 먼저 설정해주세요.');
          setIsConfig(true);
          return;
        }

        const studentId = selectedStudent.id;
        const newStudentEvals = {
          ...(evaluations[studentId] || {}),
          [instructorName]: {
            details: evalDetails,
            results: evalResults,
            note: evalNote,
            updatedAt: new Date().toISOString()
          }
        };

        setEvaluations(prev => ({
          ...prev,
          [studentId]: newStudentEvals
        }));

        alert(`${selectedStudent.name} 교육생 평가가 저장되었습니다.`);
        setSelectedStudent(null);
      };

      // 관리자 로그인
      const handleAdminAuth = () => {
        if (adminInput === '1234') {
          setIsAdminAuth(true);
          // 관리자 편집용 임시데이터 초기화
          const gMap = {};
          students.forEach(s => gMap[s.id] = s.team || '미정');
          setEditingGroups(gMap);
          setEditingInstructors({ ...groupInstructors });
        } else {
          alert('비밀번호가 올바르지 않습니다.');
        }
      };

      // 조 추가/삭제
      const handleAddGroup = () => {
        if (!newGroupName.trim()) return;
        if (groups.includes(newGroupName.trim())) return alert('이미 존재하는 조입니다.');
        setGroups([...groups, newGroupName.trim()]);
        setNewGroupName('');
      };

      const handleDeleteGroup = (groupName) => {
        if (confirm(`${groupName}를 삭제하시겠습니까?`)) {
          setGroups(groups.filter(g => g !== groupName));
        }
      };

      // 관리자 전체 저장
      const handleSaveAdminData = () => {
        const updatedStudents = students.map(s => ({
          ...s,
          team: editingGroups[s.id] || s.team,
          note: editingStudentDetails[s.id]?.note !== undefined ? editingStudentDetails[s.id].note : s.note
        }));

        setStudents(updatedStudents);
        setGroupInstructors(editingInstructors);
        alert('관리자 설정이 전체 저장되었습니다.');
      };

      // 내 담당 조 구하기
      const myAssignedGroups = groups.filter(g => groupInstructors[g] === instructorName);

      return (
        <div className="max-w-md mx-auto bg-slate-100 min-h-screen pb-20 relative">
          {/* 상단 헤더 */}
          <header className="bg-slate-900 text-white p-4 sticky top-0 z-30 shadow-md">
            <div className="flex justify-between items-center">
              <div>
                <h1 className="font-extrabold text-base tracking-wide text-amber-400">⛰️ 등반 교육 평가 시스템</h1>
                <p className="text-[11px] text-slate-400">등반 · 세컨 · 리딩 · 하강 · 보행 채점</p>
              </div>
              <button 
                onClick={() => setIsConfig(true)}
                className="bg-slate-800 hover:bg-slate-700 text-xs px-2.5 py-1.5 rounded-lg border border-slate-700 font-medium text-slate-200"
              >
                👤 {instructorName || '강사 설정'}
              </button>
            </div>

            {/* 탭 네비게이션 */}
            <div className="flex bg-slate-800 p-1 rounded-xl mt-3 text-xs font-bold">
              <button 
                onClick={() => setActiveTab('myGroup')}
                className={`flex-1 py-2 text-center rounded-lg transition-all ${activeTab === 'myGroup' ? 'bg-amber-500 text-slate-950 font-black shadow' : 'text-slate-400'}`}
              >
                내 담당 조
              </button>
              <button 
                onClick={() => setActiveTab('allGroup')}
                className={`flex-1 py-2 text-center rounded-lg transition-all ${activeTab === 'allGroup' ? 'bg-amber-500 text-slate-950 font-black shadow' : 'text-slate-400'}`}
              >
                전체 조 평가
              </button>
              <button 
                onClick={() => setActiveTab('admin')}
                className={`flex-1 py-2 text-center rounded-lg transition-all ${activeTab === 'admin' ? 'bg-indigo-600 text-white font-black shadow' : 'text-slate-400'}`}
              >
                ⚙️ 관리자
              </button>
            </div>
          </header>

          {/* 메인 콘텐츠 바디 */}
          <main className="p-4 space-y-4">

            {/* TAB 1: 내 담당 조 */}
            {activeTab === 'myGroup' && (
              <div className="space-y-4">
                {myAssignedGroups.length === 0 ? (
                  <div className="bg-white p-6 rounded-2xl border text-center space-y-2 shadow-sm">
                    <div className="text-3xl">⚠️</div>
                    <div className="font-bold text-sm text-slate-700">담당 중인 조가 없습니다</div>
                    <p className="text-xs text-slate-500">관리자 탭에서 강사님을 조 담당자로 배정해주세요.</p>
                  </div>
                ) : (
                  myAssignedGroups.map(group => {
                    const groupStudents = students.filter(s => s.team === group);
                    return (
                      <div key={group} className="bg-white rounded-2xl p-4 border shadow-sm space-y-3">
                        <div className="flex justify-between items-center border-b pb-2">
                          <span className="font-extrabold text-slate-800 text-sm flex items-center gap-1.5">
                            <span className="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                            {group} (담당: {instructorName})
                          </span>
                          <span className="text-xs bg-slate-100 px-2 py-0.5 rounded-full text-slate-600 font-bold">
                            {groupStudents.length}명
                          </span>
                        </div>

                        <div className="space-y-2">
                          {groupStudents.map(s => {
                            const myEval = evaluations[s.id]?.[instructorName];
                            return (
                              <div 
                                key={s.id} 
                                onClick={() => handleOpenStudentModal(s)}
                                className="bg-slate-50 p-3 rounded-xl border flex items-center justify-between cursor-pointer hover:bg-amber-50/50 transition-all"
                              >
                                <div>
                                  <div className="font-bold text-sm text-slate-800 flex items-center gap-2">
                                    {s.name}
                                    {s.age && <span className="text-[10px] text-slate-400">만 {s.age}세</span>}
                                  </div>
                                  {myEval ? (
                                    <div className="flex gap-1 mt-1 text-[10px] font-bold">
                                      <span className="bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded">등반: {myEval.results?.climbingResult}</span>
                                      <span className="bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded">세컨: {myEval.results?.secondBelayResult}</span>
                                      <span className="bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded">리딩: {myEval.results?.leadBelayResult}</span>
                                      <span className="bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded">하강: {myEval.results?.rappellingResult}</span>
                                      <span className="bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded">보행: {myEval.results?.walkingResult}</span>
                                    </div>
                                  ) : (
                                    <div className="text-[10px] text-amber-600 font-semibold mt-1">⚠️ 아직 평가되지 않음 (터치하여 채점)</div>
                                  )}
                                </div>
                                <span className="text-slate-400 text-xs font-bold">채점 &gt;</span>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            )}

            {/* TAB 2: 전체 조 평가 현황 */}
            {activeTab === 'allGroup' && (
              <div className="space-y-4">
                {groups.map(group => {
                  const groupStudents = students.filter(s => s.team === group);
                  const assignedInst = groupInstructors[group] || '미지정';

                  return (
                    <div key={group} className="bg-white rounded-2xl p-4 border shadow-sm space-y-3">
                      <div className="flex justify-between items-center border-b pb-2">
                        <span className="font-extrabold text-slate-800 text-sm">
                          {group} <span className="text-xs font-normal text-slate-500">(담당: {assignedInst})</span>
                        </span>
                        <span className="text-xs bg-slate-100 px-2 py-0.5 rounded-full text-slate-600 font-bold">
                          {groupStudents.length}명
                        </span>
                      </div>

                      <div className="space-y-2">
                        {groupStudents.map(s => {
                          const studentEvs = Object.entries(evaluations[s.id] || {});
                          return (
                            <div 
                              key={s.id}
                              onClick={() => handleOpenStudentModal(s)}
                              className="bg-slate-50 p-3 rounded-xl border space-y-2 cursor-pointer hover:bg-slate-100"
                            >
                              <div className="flex justify-between items-center">
                                <span className="font-bold text-sm text-slate-800">{s.name}</span>
                                <span className="text-[11px] text-indigo-600 font-bold">평가 강사: {studentEvs.length}명</span>
                              </div>

                              {studentEvs.length > 0 && (
                                <div className="space-y-1 pt-1 border-t border-slate-200 text-[11px]">
                                  {studentEvs.map(([inst, ev]) => (
                                    <div key={inst} className="flex justify-between items-center bg-white p-1.5 rounded border text-slate-700">
                                      <span className="font-bold text-slate-900">👤 {inst}</span>
                                      <div className="flex gap-1 text-[10px] font-bold">
                                        <span>등반:{ev.results?.climbingResult}</span>
                                        <span>세컨:{ev.results?.secondBelayResult}</span>
                                        <span>리딩:{ev.results?.leadBelayResult}</span>
                                        <span>하강:{ev.results?.rappellingResult}</span>
                                        <span>보행:{ev.results?.walkingResult}</span>
                                      </div>
                                    </div>
                                  ))}
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {/* TAB 3: 관리자 */}
            {activeTab === 'admin' && (
              <div className="space-y-4">
                {!isAdminAuth ? (
                  <div className="bg-white p-5 rounded-2xl border text-center space-y-3 shadow-sm">
                    <h3 className="font-bold text-sm text-slate-800">🔒 관리자 인증이 필요합니다</h3>
                    <input 
                      type="password" 
                      placeholder="비밀번호 (기본: 1234)" 
                      value={adminInput}
                      onChange={e => setAdminInput(e.target.value)}
                      className="w-full p-2.5 border rounded-xl text-sm text-center"
                    />
                    <button onClick={handleAdminAuth} className="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-xl text-sm">
                      관리자 로그인
                    </button>
                  </div>
                ) : (
                  <div className="space-y-5">
                    {/* 상단 버튼 */}
                    <div className="flex justify-between items-center border-b pb-2">
                      <h3 className="font-bold text-sm text-slate-800">⚙️ 시스템 현황 & 조 관리</h3>
                      <button onClick={handleSaveAdminData} className="bg-emerald-600 text-white font-bold text-xs px-3 py-2 rounded-xl shadow">
                        변경사항 전체 저장
                      </button>
                    </div>

                    {/* 조 생성 */}
                    <div className="bg-white p-3.5 rounded-xl border space-y-3 shadow-sm">
                      <div className="font-bold text-xs text-indigo-900">1. 조 생성 및 관리</div>
                      <div className="flex gap-2">
                        <input 
                          type="text" 
                          placeholder="새 조 이름 (예: D조)" 
                          value={newGroupName} 
                          onChange={e => setNewGroupName(e.target.value)}
                          className="flex-1 p-2 border rounded-xl text-xs"
                        />
                        <button onClick={handleAddGroup} className="bg-slate-900 text-white text-xs px-3 py-2 rounded-xl font-bold">
                          + 추가
                        </button>
                      </div>
                      <div className="flex flex-wrap gap-2 pt-1">
                        {groups.map(g => (
                          <div key={g} className="flex items-center gap-1 bg-slate-100 border px-2.5 py-1.5 rounded-lg text-xs font-bold text-slate-700">
                            <span>{g}</span>
                            <button onClick={() => handleDeleteGroup(g)} className="text-slate-400 hover:text-red-500 ml-1">✕</button>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* 조별 강사 지정 */}
                    <div className="bg-white p-3.5 rounded-xl border space-y-3 shadow-sm">
                      <div className="font-bold text-xs text-indigo-900">2. 조별 담당 강사 지정</div>
                      <div className="space-y-2">
                        {groups.map(g => (
                          <div key={g} className="flex justify-between items-center bg-slate-50 p-2 rounded-lg border text-xs">
                            <span className="font-bold text-slate-700">{g}</span>
                            <select 
                              value={editingInstructors[g] || ''}
                              onChange={e => setEditingInstructors({ ...editingInstructors, [g]: e.target.value })}
                              className="p-1 border rounded bg-white text-xs font-bold"
                            >
                              <option value="">미지정</option>
                              {instructorList.map(inst => (
                                <option key={inst.name} value={inst.name}>{inst.name}</option>
                              ))}
                            </select>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* 교육생 조 배정 */}
                    <div className="bg-white p-3.5 rounded-xl border space-y-3 shadow-sm">
                      <div className="font-bold text-xs text-indigo-900">3. 교육생 조 배정</div>
                      <div className="space-y-2">
                        {students.map(s => (
                          <div key={s.id} className="flex justify-between items-center bg-slate-50 p-2 rounded-lg border text-xs">
                            <span className="font-bold text-slate-800">{s.name} ({s.team || '미정'})</span>
                            <select 
                              value={editingGroups[s.id] || s.team || '미정'}
                              onChange={e => setEditingGroups({ ...editingGroups, [s.id]: e.target.value })}
                              className="p-1 border rounded bg-white text-xs font-bold"
                            >
                              <option value="미정">미정</option>
                              {groups.map(g => (
                                <option key={g} value={g}>{g}</option>
                              ))}
                            </select>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

          </main>

          {/* 강사 이름 입력 모달 */}
          {isConfig && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-5 w-full max-w-xs space-y-4 shadow-2xl">
                <h3 className="font-bold text-base text-slate-800 text-center">👤 강사 성함 설정</h3>
                <p className="text-xs text-slate-500 text-center">채점 기록을 남기기 위해 성함을 입력해주세요.</p>
                <input 
                  type="text" 
                  placeholder="예: 홍길동" 
                  value={tempName}
                  onChange={e => setTempName(e.target.value)}
                  className="w-full p-2.5 border rounded-xl text-sm text-center font-bold"
                />
                <button onClick={handleSaveInstructorName} className="w-full bg-slate-900 text-white font-bold py-2.5 rounded-xl text-sm">
                  확인 및 시작
                </button>
              </div>
            </div>
          )}

          {/* 교육생 채점 및 상세 모달 */}
          {selectedStudent && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs z-40 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-white rounded-t-3xl sm:rounded-2xl w-full max-w-md max-h-[90vh] overflow-y-auto p-5 space-y-4 shadow-2xl">
                
                {/* 모달 헤더 */}
                <div className="flex justify-between items-center border-b pb-3">
                  <div>
                    <h3 className="font-extrabold text-base text-slate-800 flex items-center gap-2">
                      {selectedStudent.name}
                      <span className="text-xs bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-md font-bold">
                        {selectedStudent.team || '미정'}
                      </span>
                    </h3>
                    {selectedStudent.age && <p className="text-xs text-slate-400">만 {selectedStudent.age}세</p>}
                  </div>
                  <button onClick={() => setSelectedStudent(null)} className="text-slate-400 text-xl font-bold p-1">✕</button>
                </div>

                {/* 모달 탭 */}
                <div className="flex border-b text-xs font-bold">
                  <button 
                    onClick={() => setModalTab('myScore')} 
                    className={`flex-1 py-2 text-center ${modalTab === 'myScore' ? 'border-b-2 border-amber-500 text-amber-600 font-extrabold' : 'text-slate-400'}`}
                  >
                    내 채점 입력
                  </button>
                  <button 
                    onClick={() => setModalTab('allScores')} 
                    className={`flex-1 py-2 text-center ${modalTab === 'allScores' ? 'border-b-2 border-amber-500 text-amber-600 font-extrabold' : 'text-slate-400'}`}
                  >
                    전체 강사 채점
                  </button>
                </div>

                {/* TAB 1: 내 채점 입력 (신규 체계 반영) */}
                {modalTab === 'myScore' && (
                  <div className="space-y-5 pt-1">
                    {Object.entries(EVAL_STRUCTURE).map(([categoryKey, category]) => (
                      <div key={categoryKey} className="bg-slate-50 p-3.5 rounded-xl border space-y-3">
                        <div className="font-extrabold text-xs text-slate-900 border-b pb-1.5 flex justify-between items-center">
                          <span>{category.title}</span>
                          <span className="text-[10px] font-normal text-slate-400">최종 평가</span>
                        </div>

                        {/* 세부 평가 세트 */}
                        {category.subFields.length > 0 && (
                          <div className="space-y-2">
                            {category.subFields.map(sub => {
                              const val = evalDetails[sub.key] || '';
                              return (
                                <div key={sub.key} className="flex justify-between items-center text-xs">
                                  <span className="text-slate-600 font-medium">{sub.label}</span>
                                  {sub.type === 'PF' ? (
                                    <div className="flex gap-1">
                                      {['P', 'F'].map(opt => (
                                        <button
                                          key={opt}
                                          type="button"
                                          onClick={() => handleSubFieldChange(sub.key, opt)}
                                          className={`px-2.5 py-1 rounded text-[11px] font-bold border transition-all ${
                                            val === opt 
                                              ? (opt === 'P' ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-red-600 text-white border-red-600') 
                                              : 'bg-white text-slate-500 border-slate-200'
                                          }`}
                                        >
                                          {opt === 'P' ? 'Pass' : 'Fail'}
                                        </button>
                                      ))}
                                    </div>
                                  ) : (
                                    <div className="flex gap-1">
                                      {['H', 'M', 'L'].map(opt => (
                                        <button
                                          key={opt}
                                          type="button"
                                          onClick={() => handleSubFieldChange(sub.key, opt)}
                                          className={`px-2.5 py-1 rounded text-[11px] font-bold border transition-all ${
                                            val === opt ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-500 border-slate-200'
                                          }`}
                                        >
                                          {opt === 'H' ? '상' : opt === 'M' ? '중' : '하'}
                                        </button>
                                      ))}
                                    </div>
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        )}

                        {/* 영역별 최종 결과 선택 (H / M / L) */}
                        <div className="pt-2 border-t flex justify-between items-center bg-amber-50/60 p-2 rounded-lg border border-amber-200">
                          <span className="text-xs font-bold text-amber-900">결과 (H / M / L)</span>
                          <div className="flex gap-1.5">
                            {['H', 'M', 'L'].map(resOpt => {
                              const isSelected = evalResults[category.resultKey] === resOpt;
                              return (
                                <button
                                  key={resOpt}
                                  type="button"
                                  onClick={() => handleResultChange(category.resultKey, resOpt)}
                                  className={`px-3 py-1 rounded-lg text-xs font-black border transition-all ${
                                    isSelected 
                                      ? 'bg-amber-500 text-slate-950 border-amber-600 shadow-sm scale-105' 
                                      : 'bg-white text-slate-600 border-slate-200'
                                  }`}
                                >
                                  {resOpt === 'H' ? '상(H)' : resOpt === 'M' ? '중(M)' : '하(L)'}
                                </button>
                              );
                            })}
                          </div>
                        </div>
                      </div>
                    ))}

                    {/* 종합 특이사항 메모 */}
                    <div>
                      <label className="text-xs font-bold text-slate-700 block mb-1">관찰 메모 & 특이사항</label>
                      <textarea 
                        rows="2" 
                        placeholder="강점, 보완점, 신체적 특이사항 등..."
                        value={evalNote}
                        onChange={e => setEvalNote(e.target.value)}
                        className="w-full p-2.5 border rounded-xl text-xs bg-slate-50"
                      ></textarea>
                    </div>

                    <button 
                      onClick={handleSaveEval} 
                      className="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-black py-3 rounded-xl text-sm shadow-md transition-all"
                    >
                      평가 저장하기
                    </button>
                  </div>
                )}

                {/* TAB 2: 전체 강사 기록 */}
                {modalTab === 'allScores' && (
                  <div className="space-y-3 pt-1">
                    {Object.keys(evaluations[selectedStudent.id] || {}).length === 0 ? (
                      <div className="text-center py-8 text-slate-400 text-xs">작성된 평가가 없습니다.</div>
                    ) : (
                      Object.entries(evaluations[selectedStudent.id]).map(([inst, ev]) => (
                        <div key={inst} className="bg-slate-50 p-3 rounded-xl border text-xs space-y-2">
                          <div className="font-bold text-indigo-900 border-b pb-1 flex justify-between">
                            <span>👤 {inst} 강사</span>
                            <span className="text-slate-400 text-[10px]">
                              {ev.updatedAt ? new Date(ev.updatedAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : ''}
                            </span>
                          </div>
                          <div className="grid grid-cols-3 gap-1.5 text-center font-bold text-[11px]">
                            <div className="bg-white p-1.5 rounded border">등반: {ev.results?.climbingResult}</div>
                            <div className="bg-white p-1.5 rounded border">세컨: {ev.results?.secondBelayResult}</div>
                            <div className="bg-white p-1.5 rounded border">리딩: {ev.results?.leadBelayResult}</div>
                            <div className="bg-white p-1.5 rounded border">하강: {ev.results?.rappellingResult}</div>
                            <div className="bg-white p-1.5 rounded border">보행: {ev.results?.walkingResult}</div>
                          </div>
                          {ev.note && <div className="text-slate-700 bg-white p-2 rounded border text-[11px] italic">"{ev.note}"</div>}
                        </div>
                      ))
                    )}
                  </div>
                )}

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
