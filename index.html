<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>등산학교 레벨테스트 & 자동 조 관리</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Supabase JS v2 CDN (버전 고정 및 안정화) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const SUPABASE_URL = "https://rfcnyfdhtmjvkdcipger.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJmY255ZmRodG1qdmtkY2lwZ2VyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxNzIwNTYsImV4cCI6MjEwMTc0ODA1Nn0.-cvhtokNFgNnEmbEW5hg5T5RztIpkAX8KX3eI2J2Fxo"; 

    // 안전한 Supabase 클라이언트 생성
    const getSupabaseClient = () => {
      try {
        const supabaseLib = window.supabase || window._supabase;
        if (supabaseLib && typeof supabaseLib.createClient === 'function') {
          return supabaseLib.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
      } catch (err) {
        console.error("Supabase 초기화 실패:", err);
      }
      return null;
    };

    const supabase = getSupabaseClient();

    const CATEGORIES = [
      { id: 'climbing', label: '등반', icon: '🧗‍♂️' },
      { id: 'rappelling', label: '하강', icon: '🧗‍♀️' },
      { id: 'belay', label: '후등자 빌레이', icon: '⚓' }
    ];

    const ADMIN_PASS = "1974";

    const calculateAge = (birthDateStr) => {
      if (!birthDateStr) return '';
      const birth = new Date(birthDateStr);
      const today = new Date();
      let age = today.getFullYear() - birth.getFullYear();
      const m = today.getMonth() - birth.getMonth();
      if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) {
        age--;
      }
      return age > 0 ? age : '';
    };

    function App() {
      const [instructor, setInstructor] = React.useState(() => {
        const saved = localStorage.getItem('alpine_inst');
        return saved ? JSON.parse(saved) : { name: '' };
      });
      const [tempName, setTempName] = React.useState('');
      const [isConfig, setIsConfig] = React.useState(!instructor.name);
      
      const [students, setStudents] = React.useState([]);
      const [instructorList, setInstructorList] = React.useState([]);
      const [groups, setGroups] = React.useState(['A조', 'B조', 'C조', 'D조']);
      const [evaluations, setEvaluations] = React.useState({});
      const [groupInstructors, setGroupInstructors] = React.useState({});
      const [loading, setLoading] = React.useState(true);
      const [dbError, setDbError] = React.useState(null);

      const [selectedStudent, setSelectedStudent] = React.useState(null);
      const [modalTab, setModalTab] = React.useState('myScore');
      const [activeTab, setActiveTab] = React.useState('eval');
      const [searchQuery, setSearchQuery] = React.useState('');

      const [adminInput, setAdminInput] = React.useState('');
      const [isAdminAuth, setIsAdminAuth] = React.useState(false);
      
      const [editingGroups, setEditingGroups] = React.useState({});
      const [editingInstructors, setEditingInstructors] = React.useState({});
      const [editingStudentDetails, setEditingStudentDetails] = React.useState({});
      const [newGroupName, setNewGroupName] = React.useState('');

      const [scores, setScores] = React.useState({ climbing: 70, rappelling: 70, belay: 70 });
      const [note, setNote] = React.useState('');

      const fetchData = async () => {
        setLoading(true);
        setDbError(null);
        try {
          // 실행 시점에 비동기로 한 번 더 클라이언트 점검
          const client = supabase || getSupabaseClient();
          if (!client) {
            throw new Error("Supabase CDN 라이브러리가 로드되지 않았습니다. 페이지를 새로고침 해보세요.");
          }

          const { data: stData, error: stErr } = await client.from('students').select('*').order('name');
          if (stErr) throw stErr;

          const { data: instData } = await client.from('instructors').select('*').order('last_login', { ascending: false });
          const { data: grpData } = await client.from('groups').select('*').order('created_at');
          const { data: evData } = await client.from('evaluations').select('*');
          const { data: grData } = await client.from('group_managers').select('*');

          if (stData) {
            setStudents(stData);
            const initialGroups = {};
            const initialDetails = {};
            stData.forEach(s => { 
              initialGroups[s.id] = s.group_name || '미정'; 
              initialDetails[s.id] = {
                birth_date: s.birth_date || '',
                age: s.age || calculateAge(s.birth_date) || '',
                note: s.note || ''
              };
            });
            setEditingGroups(initialGroups);
            setEditingStudentDetails(initialDetails);
          }

          if (instData) setInstructorList(instData);

          if (grpData && grpData.length > 0) {
            setGroups(grpData.map(g => g.name));
          }

          if (grData) {
            const gMap = {};
            grData.forEach(g => { gMap[g.group_name] = g.instructor_name; });
            setGroupInstructors(gMap);
            setEditingInstructors(gMap);
          }

          if (evData) {
            const formatted = {};
            evData.forEach(ev => {
              if (!formatted[ev.student_id]) formatted[ev.student_id] = {};
              formatted[ev.student_id][ev.instructor_name] = {
                scores: { climbing: ev.climbing_score, rappelling: ev.rappelling_score, belay: ev.belay_score },
                note: ev.note,
                updatedAt: ev.updated_at
              };
            });
            setEvaluations(formatted);
          }
        } catch (err) {
          console.error("데이터 로드 에러:", err);
          setDbError(err.message || "DB 접속 실패");
        } finally {
          setLoading(false);
        }
      };

      React.useEffect(() => { fetchData(); }, []);
      React.useEffect(() => { localStorage.setItem('alpine_inst', JSON.stringify(instructor)); }, [instructor]);

      const handleSaveInstructorName = async () => {
        const trimmedName = tempName.trim();
        if (!trimmedName) return;

        try {
          const client = supabase || getSupabaseClient();
          if (client) {
            await client.from('instructors').upsert({
              name: trimmedName,
              last_login: new Date().toISOString()
            }, { onConflict: 'name' });
          }
          setInstructor({ name: trimmedName });
          setIsConfig(false);
          fetchData();
        } catch (err) {
          console.error("강사 등록 실패:", err);
          setInstructor({ name: trimmedName });
          setIsConfig(false);
        }
      };

      const getStudentAvg = (studentId) => {
        const evs = Object.values(evaluations[studentId] || {});
        if (evs.length === 0) return 0;
        const sum = evs.reduce((acc, curr) => acc + curr.scores.climbing + curr.scores.rappelling + curr.scores.belay, 0);
        return Math.round(sum / (evs.length * 3));
      };

      const rankedStudents = React.useMemo(() => {
        return [...students].map(s => ({
          ...s,
          avgScore: getStudentAvg(s.id),
          evalCount: Object.keys(evaluations[s.id] || {}).length
        })).sort((a, b) => b.avgScore - a.avgScore);
      }, [students, evaluations]);

      const handleAddGroup = async () => {
        const trimmed = newGroupName.trim();
        if (!trimmed) return;
        if (groups.includes(trimmed)) {
          alert('이미 존재하는 조 이름입니다.');
          return;
        }
        setGroups([...groups, trimmed]);
        setNewGroupName('');
        const client = supabase || getSupabaseClient();
        if (client) {
          await client.from('groups').insert({ name: trimmed });
        }
      };

      const handleDeleteGroup = async (groupToDelete) => {
        if (!confirm(`'${groupToDelete}'를 삭제하시겠습니까? 해당 조에 할당된 교육생은 '미정'으로 변경됩니다.`)) return;
        setGroups(groups.filter(g => g !== groupToDelete));
        
        const newGroupState = { ...editingGroups };
        Object.keys(newGroupState).forEach(id => {
          if (newGroupState[id] === groupToDelete) newGroupState[id] = '미정';
        });
        setEditingGroups(newGroupState);

        const client = supabase || getSupabaseClient();
        if (client) {
          await client.from('groups').delete().eq('name', groupToDelete);
        }
      };

      const handleSelectInstructorChip = (groupName, instName) => {
        setEditingInstructors(prev => ({
          ...prev,
          [groupName]: prev[groupName] === instName ? '' : instName
        }));
      };

      const handleStudentGroupChange = (studentId, groupName) => {
        setEditingGroups(prev => ({ ...prev, [studentId]: groupName }));
      };

      const handleStudentDetailChange = (studentId, field, value) => {
        setEditingStudentDetails(prev => {
          const updated = { ...prev[studentId], [field]: value };
          if (field === 'birth_date') {
            updated.age = calculateAge(value);
          }
          return { ...prev, [studentId]: updated };
        });
      };

      const handleSaveAdminData = async () => {
        const client = supabase || getSupabaseClient();
        if (!client) return alert("Supabase 연결 상태를 확인해 주세요.");

        try {
          const studentUpdates = Object.entries(editingGroups).map(([id, group_name]) => {
            const details = editingStudentDetails[id] || {};
            return client.from('students').update({ 
              group_name,
              birth_date: details.birth_date || null,
              age: details.age ? parseInt(details.age) : null,
              note: details.note || ''
            }).eq('id', id);
          });

          const groupUpdates = Object.entries(editingInstructors).map(([group_name, instructor_name]) => 
            client.from('group_managers').upsert({ group_name, instructor_name }, { onConflict: 'group_name' })
          );

          await Promise.all([...studentUpdates, ...groupUpdates]);
          alert('저장되었습니다.');
          fetchData();
        } catch (err) {
          alert("저장 실패: " + err.message);
        }
      };

      const myAssignedGroup = React.useMemo(() => {
        if (!instructor.name) return null;
        const entry = Object.entries(groupInstructors).find(([_, instName]) => instName === instructor.name);
        return entry ? entry[0] : null;
      }, [instructor.name, groupInstructors]);

      const handleOpenStudent = (s) => {
        setSelectedStudent(s);
        setModalTab('myScore');
        const myEv = evaluations[s.id]?.[instructor.name];
        if (myEv) {
          setScores(myEv.scores);
          setNote(myEv.note || '');
        } else {
          setScores({ climbing: 70, rappelling: 70, belay: 70 });
          setNote('');
        }
      };

      const handleSaveEval = async () => {
        if (!selectedStudent || !instructor.name) return;
        const client = supabase || getSupabaseClient();
        if (!client) return alert("DB 연결 오류");

        try {
          const { error } = await client.from('evaluations').upsert({
            student_id: selectedStudent.id,
            instructor_name: instructor.name,
            climbing_score: scores.climbing,
            rappelling_score: scores.rappelling,
            belay_score: scores.belay,
            note: note,
            updated_at: new Date().toISOString()
          }, { onConflict: 'student_id, instructor_name' });

          if (error) throw error;
          await fetchData();
          setSelectedStudent(null);
        } catch (err) {
          alert("평가 저장 중 오류가 발생했습니다: " + err.message);
        }
      };

      const handleAdminAuth = () => {
        if (adminInput === ADMIN_PASS) {
          setIsAdminAuth(true);
        } else {
          alert('비밀번호가 올바르지 않습니다.');
        }
      };

      const filteredEvalStudents = students.filter(s => s.name.includes(searchQuery));

      return (
        <div className="max-w-md mx-auto min-h-screen pb-12 bg-white shadow-xl">
          <header className="bg-slate-900 text-white p-4 sticky top-0 z-10 flex justify-between items-center shadow-md">
            <h1 className="font-bold text-base flex items-center gap-1.5">
              <span>⛰️</span> 등산학교 평가 & 자동 조 관리
            </h1>
            <button onClick={() => { setTempName(instructor.name); setIsConfig(true); }} className="text-xs bg-slate-800 px-2.5 py-1.5 rounded-lg border border-slate-700">
              👤 {instructor.name || '강사 설정'}
            </button>
          </header>

          <div className="flex bg-slate-800 text-white text-[11px] border-t border-slate-700">
            <button onClick={() => setActiveTab('eval')} className={`flex-1 py-2.5 font-bold text-center ${activeTab === 'eval' ? 'bg-amber-500 text-slate-900' : ''}`}>1. 채점</button>
            <button onClick={() => setActiveTab('rank')} className={`flex-1 py-2.5 font-bold text-center ${activeTab === 'rank' ? 'bg-amber-500 text-slate-900' : ''}`}>2. 순위표</button>
            <button onClick={() => setActiveTab('myGroup')} className={`flex-1 py-2.5 font-bold text-center ${activeTab === 'myGroup' ? 'bg-amber-500 text-slate-900' : ''}`}>
              3. 내 담당 조 {myAssignedGroup && `(${myAssignedGroup})`}
            </button>
            <button onClick={() => setActiveTab('admin')} className={`flex-1 py-2.5 font-bold text-center ${activeTab === 'admin' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>⚙️ 관리</button>
          </div>

          <main className="p-4">
            {dbError && (
              <div className="bg-red-50 text-red-700 p-3 rounded-xl border border-red-200 text-xs mb-4">
                ⚠️ DB 연동 오류: {dbError}
              </div>
            )}

            {loading ? (
              <div className="text-center py-12 text-slate-400 text-xs font-bold">데이터를 불러오는 중...</div>
            ) : (
              <>
                {/* TAB 1: 교육생 채점 */}
                {activeTab === 'eval' && (
                  <div className="space-y-3">
                    <input 
                      type="text" 
                      placeholder="교육생 이름 검색..." 
                      value={searchQuery}
                      onChange={e => setSearchQuery(e.target.value)}
                      className="w-full p-2.5 bg-slate-50 border rounded-xl text-sm mb-2"
                    />
                    {filteredEvalStudents.length === 0 ? (
                      <div className="text-center py-8 text-slate-400 text-xs">
                        등록된 교육생이 없습니다.
                      </div>
                    ) : (
                      <div className="grid grid-cols-2 gap-3">
                        {filteredEvalStudents.map(s => {
                          const hasMyEval = !!evaluations[s.id]?.[instructor.name];
                          return (
                            <div key={s.id} onClick={() => handleOpenStudent(s)} className="bg-white p-3 rounded-2xl border shadow-sm cursor-pointer text-center relative hover:border-amber-400 flex flex-col justify-between">
                              {hasMyEval && <span className="absolute top-2 right-2 text-[10px] bg-emerald-100 text-emerald-700 font-bold px-1.5 py-0.5 rounded">완료</span>}
                              <div>
                                <img src={s.photo_url || "" />
                                <div className="flex justify-center items-center gap-1 mb-1">
                                  <span className="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded font-semibold">{editingGroups[s.id] || '미정'}</span>
                                  {s.age && <span className="text-[10px] bg-indigo-50 text-indigo-600 px-1.5 py-0.5 rounded font-semibold">{s.age}세</span>}
                                </div>
                                <h3 className="font-bold text-sm text-slate-800">{s.name}</h3>
                              </div>
                              {s.note && (
                                <div className="mt-2 text-[10px] text-amber-800 bg-amber-50 p-1 rounded border border-amber-100 truncate">
                                  📌 {s.note}
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                )}

                {/* TAB 2: 종합 순위 */}
                {activeTab === 'rank' && (
                  <div className="space-y-2">
                    <div className="bg-amber-50 p-3 rounded-xl border border-amber-200 text-xs text-amber-800 font-medium mb-3">
                      💡 전체 강사 평가 합산 순위입니다.
                    </div>
                    {rankedStudents.map((s, idx) => (
                      <div key={s.id} onClick={() => handleOpenStudent(s)} className="bg-white p-3 rounded-xl border flex justify-between items-center shadow-sm cursor-pointer">
                        <div className="flex items-center gap-3">
                          <span className="font-bold text-slate-400 text-sm w-5">{idx + 1}</span>
                          <img src={s.photo_url || "" />
                          <div>
                            <div className="font-bold text-sm flex items-center gap-1">
                              {s.name} 
                              <span className="text-xs text-slate-400 font-normal">({editingGroups[s.id] || '미정'})</span>
                              {s.age && <span className="text-[10px] text-indigo-600 font-normal">| {s.age}세</span>}
                            </div>
                            <div className="text-[10px] text-slate-400">{s.evalCount}명 강사 평가 완료</div>
                          </div>
                        </div>
                        <div className="text-lg font-black text-amber-600">{s.avgScore} <span className="text-xs text-slate-400 font-normal">점</span></div>
                      </div>
                    ))}
                  </div>
                )}

                {/* TAB 3: 내 담당 조 */}
                {activeTab === 'myGroup' && (
                  <div className="space-y-4">
                    {!myAssignedGroup ? (
                      <div className="bg-white p-6 rounded-2xl border text-center space-y-2 shadow-sm">
                        <div className="text-2xl">📋</div>
                        <h3 className="font-bold text-sm text-slate-800">배정된 담당 조가 없습니다</h3>
                        <p className="text-xs text-slate-500">
                          관리자가 <b>{instructor.name || '성함 미입력'}</b> 강사님을 특정 조의 담당으로 배정하면 여기에 결과가 표시됩니다.
                        </p>
                      </div>
                    ) : (
                      <div className="space-y-3">
                        <div className="bg-indigo-50 border border-indigo-200 p-3 rounded-xl text-xs font-bold text-indigo-900 flex justify-between items-center">
                          <span>👤 {instructor.name} 강사님의 담당 조:</span>
                          <span className="bg-indigo-600 text-white px-2.5 py-1 rounded-lg">{myAssignedGroup}</span>
                        </div>

                        {students.filter(s => editingGroups[s.id] === myAssignedGroup).map(s => {
                          const studentEvs = Object.entries(evaluations[s.id] || {});
                          return (
                            <div key={s.id} className="bg-white p-4 rounded-2xl border shadow-sm space-y-3">
                              <div className="flex justify-between items-center border-b pb-2">
                                <div className="flex items-center gap-2">
                                  <img src={s.photo_url || "" />
                                  <div>
                                    <div className="font-bold text-sm flex items-center gap-1">
                                      {s.name}
                                      {s.age && <span className="text-xs text-indigo-600 font-normal">({s.age}세)</span>}
                                    </div>
                                    {s.note && <div className="text-[10px] text-amber-800">📌 {s.note}</div>}
                                  </div>
                                </div>
                                <span className="text-sm font-black text-amber-600">{getStudentAvg(s.id)}점</span>
                              </div>

                              <div className="space-y-2">
                                <div className="text-[11px] font-bold text-slate-500">타 강사 평가 및 특이사항 메모:</div>
                                {studentEvs.length === 0 ? (
                                  <div className="text-xs text-slate-400 italic">작성된 평가가 없습니다.</div>
                                ) : (
                                  studentEvs.map(([instName, ev]) => (
                                    <div key={instName} className="bg-slate-50 p-2.5 rounded-xl text-xs space-y-1 border">
                                      <div className="flex justify-between font-bold text-indigo-900">
                                        <span>👤 {instName} 강사</span>
                                        <span className="text-slate-500 font-normal text-[10px]">등반:{ev.scores.climbing} / 하강:{ev.scores.rappelling} / 빌레이:{ev.scores.belay}</span>
                                      </div>
                                      {ev.note ? (
                                        <div className="text-slate-700 font-medium bg-white p-2 rounded-lg border text-[11px] mt-1">
                                          📝 "{ev.note}"
                                        </div>
                                      ) : (
                                        <div className="text-slate-400 italic text-[10px]">메모 없음</div>
                                      )}
                                    </div>
                                  ))
                                )}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                )}

                {/* TAB 4: 관리자 */}
                {activeTab === 'admin' && (
                  <div className="space-y-4">
                    {!isAdminAuth ? (
                      <div className="bg-white p-5 rounded-2xl border text-center space-y-3 shadow-sm">
                        <h3 className="font-bold text-sm text-slate-800">🔒 관리자 인증이 필요합니다</h3>
                        <input 
                          type="password" 
                          placeholder="비밀번호 (기본: 1234)" 
                          value={adminInput}
                          onChange={e => setAdminInput(e.target.value)}
                          className="w-full p-2.5 border rounded-xl text-sm text-center"
                        />
                        <button onClick={handleAdminAuth} className="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-xl text-sm">
                          관리자 로그인
                        </button>
                      </div>
                    ) : (
                      <div className="space-y-5">
                        <div className="flex justify-between items-center border-b pb-2">
                          <h3 className="font-bold text-sm text-slate-800">⚙️ 시스템 현황 & 조 관리</h3>
                          <button onClick={handleSaveAdminData} className="bg-emerald-600 text-white font-bold text-xs px-3 py-2 rounded-xl shadow">
                            변경사항 전체 저장
                          </button>
                        </div>

                        {/* 1. 접속/등록된 강사 목록 */}
                        <div className="bg-slate-900 text-white p-3.5 rounded-xl space-y-2 shadow-sm">
                          <div className="flex justify-between items-center">
                            <span className="font-bold text-xs text-amber-400 flex items-center gap-1">
                              👥 등록된 강사 목록 ({instructorList.length}명)
                            </span>
                            <button onClick={fetchData} className="text-[10px] bg-slate-800 px-2 py-1 rounded text-slate-300">새로고침</button>
                          </div>
                          {instructorList.length === 0 ? (
                            <div className="text-xs text-slate-400 py-2 text-center">아직 접속한 강사가 없습니다.</div>
                          ) : (
                            <div className="grid grid-cols-2 gap-2 pt-1">
                              {instructorList.map(inst => (
                                <div key={inst.id || inst.name} className="bg-slate-800 p-2 rounded-lg border border-slate-700 flex justify-between items-center text-xs">
                                  <span className="font-bold text-slate-200">👤 {inst.name}</span>
                                  <span className="text-[9px] text-slate-400">
                                    {inst.last_login ? new Date(inst.last_login).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : ''}
                                  </span>
                                </div>
                              ))}
                            </div>
                          )}
                        </div>

                        {/* 2. 조 추가 / 삭제 */}
                        <div className="bg-white p-3.5 rounded-xl border space-y-3 shadow-sm">
                          <div className="font-bold text-xs text-indigo-900">1. 조 생성 및 목록 관리</div>
                          <div className="flex gap-2">
                            <input 
                              type="text" 
                              placeholder="새 조 이름 (예: E조)" 
                              value={newGroupName} 
                              onChange={e => setNewGroupName(e.target.value)}
                              className="flex-1 p-2 border rounded-xl text-xs"
                            />
                            <button onClick={handleAddGroup} className="bg-slate-900 text-white text-xs px-3 py-2 rounded-xl font-bold">
                              + 추가
                            </button>
                          </div>
                          <div className="flex flex-wrap gap-2 pt-1">
                            {groups.map(g => (
                              <div key={g} className="flex items-center gap-1 bg-slate-100 border px-2.5 py-1.5 rounded-lg text-xs font-bold text-slate-700">
                                <span>{g}</span>
                                <button onClick={() => handleDeleteGroup(g)} className="text-slate-400 hover:text-red-500 ml-1">✕</button>
                              </div>
                            ))}
                          </div>
                        </div>

                        {/* 3. 조별 담당 강사 지정 */}
                        <div className="bg-white p-3.5 rounded-xl border space-y-3 shadow-sm">
                          <div className="font-bold text-xs text-indigo-900">2. 조별 담당 강사 지정</div>
                          <div className="space-y-3">
                            {groups.map(g => (
                              <div key={g} className="bg-slate-50 p-2.5 rounded-xl border space-y-1.5">
                                <div className="text-xs font-bold text-slate-700 flex justify-between">
                                  <span>{g} 담당 강사:</span>
                                  <span className="text-indigo-600 font-extrabold">{editingInstructors[g] || '미지정'}</span>
                                </div>
                                <div className="flex flex-wrap gap-1.5 pt-1">
                                  {instructorList.length === 0 ? (
                                    <span className="text-[11px] text-slate-400 italic">등록된 강사가 없습니다.</span>
                                  ) : (
                                    instructorList.map(inst => {
                                      const isSelected = editingInstructors[g] === inst.name;
                                      return (
                                        <button 
                                          key={inst.name}
                                          onClick={() => handleSelectInstructorChip(g, inst.name)}
                                          className={`text-[11px] px-2.5 py-1 rounded-full border transition-all ${isSelected ? 'bg-indigo-600 text-white font-bold border-indigo-600 shadow-xs' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-100'}`}
                                        >
                                          👤 {inst.name}
                                        </button>
                                      );
                                    })
                                  )}
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>

                        {/* 4. 교육생 프로필 수정 */}
                        <div className="bg-white p-3.5 rounded-xl border space-y-3 shadow-sm">
                          <div className="font-bold text-xs text-indigo-900">3. 교육생 프로필 & 인적사항 수정</div>
                          <div className="space-y-3">
                            {students.map(s => {
                              const details = editingStudentDetails[s.id] || {};
                              return (
                                <div key={s.id} className="bg-slate-50 p-3 rounded-xl border space-y-2 text-xs">
                                  <div className="flex items-center gap-2 font-bold text-slate-800">
                                    <img src={s.photo_url || "" />
                                    <span>{s.name}</span>
                                    {details.age && <span className="text-[10px] text-indigo-600 bg-indigo-50 px-1.5 py-0.5 rounded">만 {details.age}세</span>}
                                  </div>
                                  <div className="grid grid-cols-2 gap-2">
                                    <div>
                                      <label className="text-[10px] text-slate-400 block mb-0.5">생년월일</label>
                                      <input 
                                        type="date" 
                                        value={details.birth_date || ''}
                                        onChange={e => handleStudentDetailChange(s.id, 'birth_date', e.target.value)}
                                        className="w-full p-1.5 border rounded bg-white text-xs"
                                      />
                                    </div>
                                    <div>
                                      <label className="text-[10px] text-slate-400 block mb-0.5">나이 (자동 계산)</label>
                                      <input 
                                        type="number" 
                                        placeholder="나이"
                                        value={details.age || ''}
                                        onChange={e => handleStudentDetailChange(s.id, 'age', e.target.value)}
                                        className="w-full p-1.5 border rounded bg-white text-xs"
                                      />
                                    </div>
                                  </div>
                                  <div>
                                    <label className="text-[10px] text-slate-400 block mb-0.5">소속 조 선택</label>
                                    <select 
                                      value={editingGroups[s.id] || '미정'}
                                      onChange={e => handleStudentGroupChange(s.id, e.target.value)}
                                      className="w-full p-1.5 border rounded bg-white text-xs font-bold text-slate-700"
                                    >
                                      <option value="미정">미정</option>
                                      {groups.map(g => (
                                        <option key={g} value={g}>{g}</option>
                                      ))}
                                    </select>
                                  </div>
                                  <div>
                                    <label className="text-[10px] text-slate-400 block mb-0.5">특이사항 / 메모</label>
                                    <input 
                                      type="text" 
                                      placeholder="특이사항 입력..."
                                      value={details.note || ''}
                                      onChange={e => handleStudentDetailChange(s.id, 'note', e.target.value)}
                                      className="w-full p-1.5 border rounded bg-white text-xs"
                                    />
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </>
            )}
          </main>

          {/* 강사 이름 입력 모달 */}
          {isConfig && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-5 w-full max-w-xs space-y-4 shadow-2xl">
                <h3 className="font-bold text-base text-slate-800 text-center">👤 강사 이름 설정</h3>
                <p className="text-xs text-slate-500 text-center">채점 및 담당 조 확인을 위해 성함을 입력해주세요.</p>
                <input 
                  type="text" 
                  placeholder="예: 홍길동" 
                  value={tempName}
                  onChange={e => setTempName(e.target.value)}
                  className="w-full p-2.5 border rounded-xl text-sm text-center font-bold"
                />
                <button onClick={handleSaveInstructorName} className="w-full bg-slate-900 text-white font-bold py-2.5 rounded-xl text-sm">
                  확인
                </button>
              </div>
            </div>
          )}

          {/* 교육생 상세 & 채점 모달 */}
          {selectedStudent && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs z-40 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-white rounded-t-3xl sm:rounded-2xl w-full max-w-md max-h-[90vh] overflow-y-auto p-5 space-y-4 shadow-2xl">
                <div className="flex justify-between items-start border-b pb-3">
                  <div className="flex items-center gap-3">
                    <img src={selectedStudent.photo_url || "https://via.placeholder.com/150"} className="w-12 h-12 rounded-full object-cover border" />
                    <div>
                      <h3 className="font-bold text-base text-slate-800 flex items-center gap-1.5">
                        {selectedStudent.name}
                        <span className="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md font-normal">
                          {editingGroups[selectedStudent.id] || '미정'}
                        </span>
                      </h3>
                      {selectedStudent.age && <span className="text-xs text-indigo-600 font-medium">만 {selectedStudent.age}세</span>}
                    </div>
                  </div>
                  <button onClick={() => setSelectedStudent(null)} className="text-slate-400 hover:text-slate-600 text-xl font-bold p-1">✕</button>
                </div>

                <div className="flex border-b text-xs font-bold">
                  <button onClick={() => setModalTab('myScore')} className={`flex-1 py-2 text-center ${modalTab === 'myScore' ? 'border-b-2 border-amber-500 text-amber-600' : 'text-slate-400'}`}>내 평가 입력</button>
                  <button onClick={() => setModalTab('allScores')} className={`flex-1 py-2 text-center ${modalTab === 'allScores' ? 'border-b-2 border-amber-500 text-amber-600' : 'text-slate-400'}`}>전체 강사 기록</button>
                </div>

                {modalTab === 'myScore' ? (
                  <div className="space-y-4 pt-1">
                    {CATEGORIES.map(cat => (
                      <div key={cat.id} className="space-y-1 bg-slate-50 p-3 rounded-xl border">
                        <div className="flex justify-between text-xs font-bold text-slate-700">
                          <span>{cat.icon} {cat.label}</span>
                          <span className="text-amber-600 font-extrabold text-sm">{scores[cat.id]}점</span>
                        </div>
                        <input 
                          type="range" 
                          min="0" 
                          max="100" 
                          value={scores[cat.id]}
                          onChange={e => setScores({ ...scores, [cat.id]: parseInt(e.target.value) })}
                          className="w-full accent-amber-500 h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer"
                        />
                      </div>
                    ))}
                    <div>
                      <label className="text-xs font-bold text-slate-700 block mb-1">관찰 메모 & 특이사항</label>
                      <textarea 
                        rows="2" 
                        placeholder="특이사항이나 강점/보완점을 적어주세요..."
                        value={note}
                        onChange={e => setNote(e.target.value)}
                        className="w-full p-2.5 border rounded-xl text-xs bg-slate-50"
                      ></textarea>
                    </div>
                    <button onClick={handleSaveEval} className="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3 rounded-xl text-sm shadow-md">
                      평가 저장하기
                    </button>
                  </div>
                ) : (
                  <div className="space-y-3 pt-1">
                    {Object.keys(evaluations[selectedStudent.id] || {}).length === 0 ? (
                      <div className="text-center py-6 text-slate-400 text-xs">아직 작성된 평가가 없습니다.</div>
                    ) : (
                      Object.entries(evaluations[selectedStudent.id]).map(([instName, ev]) => (
                        <div key={instName} className="bg-slate-50 p-3 rounded-xl border text-xs space-y-1.5">
                          <div className="flex justify-between font-bold text-indigo-900 border-b pb-1">
                            <span>👤 {instName} 강사</span>
                            <span className="text-amber-600">
                              평균 {Math.round((ev.scores.climbing + ev.scores.rappelling + ev.scores.belay) / 3)}점
                            </span>
                          </div>
                          <div className="grid grid-cols-3 gap-1 text-[10px] text-slate-600 text-center py-1 bg-white rounded border">
                            <div>등반: {ev.scores.climbing}</div>
                            <div>하강: {ev.scores.rappelling}</div>
                            <div>빌레이: {ev.scores.belay}</div>
                          </div>
                          {ev.note && <div className="text-slate-700 text-[11px] bg-white p-2 rounded border italic">"{ev.note}"</div>}
                        </div>
                      ))
                    )}
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
