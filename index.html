<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>등산학교 레벨테스트 & 자동 조 관리</title>
  <!-- Tailwind CSS & React & Supabase CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    // ★ Supabase 정보 입력 (본인 프로젝트 주소와 키로 교체하세요)
    const SUPABASE_URL = "https://rfcnyfdhtmjvkdcipger.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_0qx2MvW4AsHrQeHrK7OmzA_kcxFr9yi";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const CATEGORIES = [
      { id: 'climbing', label: '등반', icon: '🧗‍♂️' },
      { id: 'rappelling', label: '하강', icon: '🧗‍♀️' },
      { id: 'belay', label: '후등자 빌레이', icon: '⚓' }
    ];

    const DEFAULT_GROUPS = ['A', 'B', 'C', 'D'];
    const ADMIN_PASS = "1234"; // 관리자 비밀번호

    function App() {
      const [instructor, setInstructor] = React.useState(() => {
        const saved = localStorage.getItem('alpine_inst');
        return saved ? JSON.parse(saved) : { name: '' };
      });
      const [isConfig, setIsConfig] = React.useState(!instructor.name);
      const [students, setStudents] = React.useState([]);
      const [evaluations, setEvaluations] = React.useState({});
      const [groupInstructors, setGroupInstructors] = React.useState({ A: '', B: '', C: '', D: '' });
      
      const [selectedStudent, setSelectedStudent] = React.useState(null);
      const [modalTab, setModalTab] = React.useState('myScore');
      const [activeTab, setActiveTab] = React.useState('eval');
      const [searchQuery, setSearchQuery] = React.useState('');

      // 관리자 모드 상태
      const [adminInput, setAdminInput] = React.useState('');
      const [isAdminAuth, setIsAdminAuth] = React.useState(false);
      const [editingGroups, setEditingGroups] = React.useState({});
      const [editingInstructors, setEditingInstructors] = React.useState({ A: '', B: '', C: '', D: '' });

      // 채점 폼 상태
      const [scores, setScores] = React.useState({ climbing: 70, rappelling: 70, belay: 70 });
      const [note, setNote] = React.useState('');

      // DB 데이터 로드
      const fetchData = async () => {
        const { data: stData } = await supabase.from('students').select('*').order('name');
        const { data: evData } = await supabase.from('evaluations').select('*');
        const { data: grData } = await supabase.from('group_managers').select('*');

        if (stData) {
          setStudents(stData);
          const initialGroups = {};
          stData.forEach(s => { initialGroups[s.id] = s.group_name || '미정'; });
          setEditingGroups(initialGroups);
        }

        if (grData) {
          const gMap = { A: '', B: '', C: '', D: '' };
          grData.forEach(g => { gMap[g.group_name] = g.instructor_name; });
          setGroupInstructors(gMap);
          setEditingInstructors(gMap);
        }

        if (evData) {
          const formatted = {};
          evData.forEach(ev => {
            if (!formatted[ev.student_id]) formatted[ev.student_id] = {};
            formatted[ev.student_id][ev.instructor_name] = {
              scores: { climbing: ev.climbing_score, rappelling: ev.rappelling_score, belay: ev.belay_score },
              note: ev.note,
              updatedAt: ev.updated_at
            };
          });
          setEvaluations(formatted);
        }
      };

      React.useEffect(() => { fetchData(); }, []);
      React.useEffect(() => { localStorage.setItem('alpine_inst', JSON.stringify(instructor)); }, [instructor]);

      // 접속한 강사의 담당 조 자동 찾기
      const myAssignedGroup = React.useMemo(() => {
        if (!instructor.name) return null;
        const entry = Object.entries(groupInstructors).find(([_, instName]) => instName === instructor.name);
        return entry ? entry[0] : null;
      }, [instructor.name, groupInstructors]);

      // 평균 점수 계산
      const getStudentAvg = (studentId) => {
        const evs = Object.values(evaluations[studentId] || {});
        if (evs.length === 0) return 0;
        const sum = evs.reduce((acc, curr) => acc + curr.scores.climbing + curr.scores.rappelling + curr.scores.belay, 0);
        return Math.round(sum / (evs.length * 3));
      };

      // 순위 산출
      const rankedStudents = React.useMemo(() => {
        return [...students].map(s => ({
          ...s,
          avgScore: getStudentAvg(s.id),
          evalCount: Object.keys(evaluations[s.id] || {}).length
        })).sort((a, b) => b.avgScore - a.avgScore);
      }, [students, evaluations]);

      const handleOpenStudent = (s) => {
        setSelectedStudent(s);
        setModalTab('myScore');
        const myEv = evaluations[s.id]?.[instructor.name];
        if (myEv) {
          setScores(myEv.scores);
          setNote(myEv.note || '');
        } else {
          setScores({ climbing: 70, rappelling: 70, belay: 70 });
          setNote('');
        }
      };

      // 평가 저장
      const handleSaveEval = async () => {
        if (!selectedStudent || !instructor.name) return;
        await supabase.from('evaluations').upsert({
          student_id: selectedStudent.id,
          instructor_name: instructor.name,
          climbing_score: scores.climbing,
          rappelling_score: scores.rappelling,
          belay_score: scores.belay,
          note: note,
          updated_at: new Date().toISOString()
        }, { onConflict: 'student_id, instructor_name' });

        await fetchData();
        setSelectedStudent(null);
      };

      // 관리자: 조 및 담당강사 변경 일괄 저장
      const handleSaveAdminData = async () => {
        // 1. 학생별 조 업데이트
        const studentUpdates = Object.entries(editingGroups).map(([id, group_name]) => 
          supabase.from('students').update({ group_name }).eq('id', id)
        );

        // 2. 조별 담당 강사 업데이트
        const groupUpdates = Object.entries(editingInstructors).map(([group_name, instructor_name]) => 
          supabase.from('group_managers').upsert({ group_name, instructor_name }, { onConflict: 'group_name' })
        );

        await Promise.all([...studentUpdates, ...groupUpdates]);
        alert('조 배정 및 담당 강사 설정이 성공적으로 저장되었습니다.');
        fetchData();
      };

      const handleAdminAuth = () => {
        if (adminInput === ADMIN_PASS) {
          setIsAdminAuth(true);
        } else {
          alert('비밀번호가 올바르지 않습니다.');
        }
      };

      const filteredEvalStudents = students.filter(s => s.name.includes(searchQuery));

      return (
        <div className="max-w-md mx-auto min-h-screen pb-12">
          {/* Header */}
          <header className="bg-slate-900 text-white p-4 sticky top-0 z-10 flex justify-between items-center shadow-md">
            <h1 className="font-bold text-base flex items-center gap-1.5">
              <span>⛰️</span> 등산학교 평가 & 조 관리
            </h1>
            <button onClick={() => setIsConfig(true)} className="text-xs bg-slate-800 px-2.5 py-1.5 rounded-lg border border-slate-700">
              👤 {instructor.name || '강사 설정'}
            </button>
          </header>

          {/* Tab Navigation */}
          <div className="flex bg-slate-800 text-white text-[11px] border-t border-slate-700">
            <button onClick={() => setActiveTab('eval')} className={`flex-1 py-2.5 font-bold text-center ${activeTab === 'eval' ? 'bg-amber-500 text-slate-900' : ''}`}>1. 채점</button>
            <button onClick={() => setActiveTab('rank')} className={`flex-1 py-2.5 font-bold text-center ${activeTab === 'rank' ? 'bg-amber-500 text-slate-900' : ''}`}>2. 순위표</button>
            <button onClick={() => setActiveTab('myGroup')} className={`flex-1 py-2.5 font-bold text-center ${activeTab === 'myGroup' ? 'bg-amber-500 text-slate-900' : ''}`}>
              3. 내 담당 조 {myAssignedGroup && `(${myAssignedGroup})`}
            </button>
            <button onClick={() => setActiveTab('admin')} className={`flex-1 py-2.5 font-bold text-center ${activeTab === 'admin' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>⚙️ 조/강사 관리</button>
          </div>

          <main className="p-4">
            {/* TAB 1: 교육생 채점 */}
            {activeTab === 'eval' && (
              <div className="space-y-3">
                <input 
                  type="text" 
                  placeholder="교육생 이름 검색..." 
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  className="w-full p-2.5 bg-white border rounded-xl text-sm mb-2"
                />
                <div className="grid grid-cols-2 gap-3">
                  {filteredEvalStudents.map(s => {
                    const hasMyEval = !!evaluations[s.id]?.[instructor.name];
                    return (
                      <div key={s.id} onClick={() => handleOpenStudent(s)} className="bg-white p-3 rounded-2xl border shadow-sm cursor-pointer text-center relative">
                        {hasMyEval && <span className="absolute top-2 right-2 text-[10px] bg-emerald-100 text-emerald-700 font-bold px-1.5 py-0.5 rounded">완료</span>}
                        <img src={s.photo_url || "https://via.placeholder.com/150"} className="w-16 h-16 rounded-full mx-auto object-cover mb-2 border" />
                        <span className="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded font-semibold">{s.group_name || '미정'}</span>
                        <h3 className="font-bold text-sm text-slate-800 mt-1">{s.name}</h3>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TAB 2: 종합 순위 */}
            {activeTab === 'rank' && (
              <div className="space-y-2">
                <div className="bg-amber-50 p-3 rounded-xl border border-amber-200 text-xs text-amber-800 font-medium mb-3">
                  💡 전체 강사 평가 합산 순위입니다. 관리자가 결과를 참고하여 조를 지정합니다.
                </div>
                {rankedStudents.map((s, idx) => (
                  <div key={s.id} onClick={() => handleOpenStudent(s)} className="bg-white p-3 rounded-xl border flex justify-between items-center shadow-sm cursor-pointer">
                    <div className="flex items-center gap-3">
                      <span className="font-bold text-slate-400 text-sm w-5">{idx + 1}</span>
                      <img src={s.photo_url} className="w-10 h-10 rounded-full object-cover" />
                      <div>
                        <div className="font-bold text-sm">{s.name} <span className="text-xs text-slate-400 font-normal">({s.group_name || '미정'})</span></div>
                        <div className="text-[10px] text-slate-400">{s.evalCount}명 강사 평가 완료</div>
                      </div>
                    </div>
                    <div className="text-lg font-black text-amber-600">{s.avgScore} <span className="text-xs text-slate-400 font-normal">점</span></div>
                  </div>
                ))}
              </div>
            )}

            {/* TAB 3: 내 담당 조 자동 표시 */}
            {activeTab === 'myGroup' && (
              <div className="space-y-4">
                {!myAssignedGroup ? (
                  <div className="bg-white p-6 rounded-2xl border text-center space-y-2 shadow-sm">
                    <div className="text-2xl">📋</div>
                    <h3 className="font-bold text-sm text-slate-800">배정된 담당 조가 없습니다</h3>
                    <p className="text-xs text-slate-500">
                      관리자가 강사님(<b>{instructor.name || '성함 미입력'}</b>)을 특정 조의 담당 강사로 지정하면 이곳에 해당 조원들의 상세 평가 내역이 자동으로 표시됩니다.
                    </p>
                  </div>
                ) : (
                  <div className="space-y-3">
                    <div className="bg-indigo-50 border border-indigo-200 p-3 rounded-xl text-xs font-bold text-indigo-900 flex justify-between items-center">
                      <span>👤 {instructor.name} 강사님의 담당 조:</span>
                      <span className="bg-indigo-600 text-white px-2.5 py-1 rounded-lg">{myAssignedGroup} 조</span>
                    </div>

                    {students.filter(s => s.group_name === myAssignedGroup).map(s => {
                      const studentEvs = Object.entries(evaluations[s.id] || {});
                      return (
                        <div key={s.id} className="bg-white p-4 rounded-2xl border shadow-sm space-y-3">
                          <div className="flex justify-between items-center border-b pb-2">
                            <div className="flex items-center gap-2">
                              <img src={s.photo_url} className="w-8 h-8 rounded-full object-cover" />
                              <span className="font-bold text-sm">{s.name}</span>
                            </div>
                            <span className="text-sm font-black text-amber-600">{getStudentAvg(s.id)}점</span>
                          </div>

                          <div className="space-y-2">
                            <div className="text-[11px] font-bold text-slate-500">타 강사 평가 및 특이사항 메모:</div>
                            {studentEvs.length === 0 ? (
                              <div className="text-xs text-slate-400 italic">아직 작성된 평가가 없습니다.</div>
                            ) : (
                              studentEvs.map(([instName, ev]) => (
                                <div key={instName} className="bg-slate-50 p-2.5 rounded-xl text-xs space-y-1 border border-slate-100">
                                  <div className="flex justify-between font-bold text-indigo-900">
                                    <span>👤 {instName} 강사</span>
                                    <span className="text-slate-500 font-normal text-[10px]">등반:{ev.scores.climbing} / 하강:{ev.scores.rappelling} / 빌레이:{ev.scores.belay}</span>
                                  </div>
                                  {ev.note ? (
                                    <div className="text-slate-700 font-medium bg-white p-2 rounded-lg border text-[11px] mt-1">
                                      📝 "{ev.note}"
                                    </div>
                                  ) : (
                                    <div className="text-slate-400 italic text-[10px]">메모 없음</div>
                                  )}
                                </div>
                              ))
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}

            {/* TAB 4: 관리자 조 & 담당 강사 관리 */}
            {activeTab === 'admin' && (
              <div className="space-y-4">
                {!isAdminAuth ? (
                  <div className="bg-white p-5 rounded-2xl border text-center space-y-3 shadow-sm">
                    <h3 className="font-bold text-sm text-slate-800">🔒 관리자 인증이 필요합니다</h3>
                    <input 
                      type="password" 
                      placeholder="비밀번호 입력 (기본: 1234)" 
                      value={adminInput}
                      onChange={e => setAdminInput(e.target.value)}
                      className="w-full p-2.5 border rounded-xl text-sm text-center"
                    />
                    <button onClick={handleAdminAuth} className="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-xl text-sm">
                      관리자 로그인
                    </button>
                  </div>
                ) : (
                  <div className="space-y-5">
                    <div className="flex justify-between items-center border-b pb-2">
                      <h3 className="font-bold text-sm text-slate-800">⚙️ 조 & 담당 강사 관리</h3>
                      <button onClick={handleSaveAdminData} className="bg-emerald-600 text-white font-bold text-xs px-3 py-2 rounded-xl shadow">
                        변경사항 전체 저장
                      </button>
                    </div>

                    {/* 1. 조별 담당 강사 지정 */}
                    <div className="bg-white p-3.5 rounded-xl border space-y-2 shadow-sm">
                      <div className="font-bold text-xs text-indigo-900 mb-1">1. 각 조별 담당 강사 지정</div>
                      <div className="grid grid-cols-2 gap-2">
                        {DEFAULT_GROUPS.map(g => (
                          <div key={g} className="flex items-center gap-2 bg-slate-50 p-2 rounded-lg border text-xs">
                            <span className="font-bold text-slate-600 w-8">{g} 조:</span>
                            <input 
                              type="text" 
                              placeholder="강사 성함" 
                              value={editingInstructors[g] || ''} 
                              onChange={e => setEditingInstructors({ ...editingInstructors, [g]: e.target.value })}
                              className="w-full p-1 border rounded text-xs"
                            />
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* 2. 교육생 조 지정 */}
                    <div className="bg-white p-3.5 rounded-xl border space-y-2 shadow-sm">
                      <div className="font-bold text-xs text-indigo-900 mb-1">2. 교육생 조 배정 (순위순 정렬)</div>
                      <div className="space-y-2">
                        {rankedStudents.map(s => (
                          <div key={s.id} className="flex justify-between items-center p-2 rounded-lg border text-xs">
                            <div className="flex items-center gap-2">
                              <img src={s.photo_url} className="w-7 h-7 rounded-full object-cover" />
                              <span className="font-bold">{s.name}</span>
                              <span className="text-slate-400">({s.avgScore}점)</span>
                            </div>
                            <select 
                              value={editingGroups[s.id] || '미정'} 
                              onChange={e => setEditingGroups({ ...editingGroups, [s.id]: e.target.value })}
                              className="p-1 bg-slate-100 border rounded text-xs font-bold text-indigo-900"
                            >
                              <option value="미정">미정</option>
                              {DEFAULT_GROUPS.map(g => <option key={g} value={g}>{g} 조</option>)}
                            </select>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* Modal: 강사 설정 */}
          {isConfig && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white p-5 rounded-2xl w-full max-w-xs space-y-4">
                <h2 className="font-bold text-base text-slate-800">강사 성함을 입력해 주세요</h2>
                <input 
                  type="text" 
                  placeholder="예: 김강사" 
                  value={instructor.name}
                  onChange={e => setInstructor(prev => ({ ...prev, name: e.target.value }))}
                  className="w-full p-2.5 border rounded-xl text-sm"
                />
                <button 
                  onClick={() => instructor.name && setIsConfig(false)}
                  className="w-full bg-slate-900 text-white py-2.5 rounded-xl font-bold text-sm"
                >
                  시작하기
                </button>
              </div>
            </div>
          )}

          {/* Modal: 채점 및 타 강사 보기 */}
          {selectedStudent && (
            <div className="fixed inset-0 bg-black/60 flex items-end sm:items-center justify-center z-50 p-0 sm:p-4">
              <div className="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-4 max-h-[85vh] overflow-y-auto space-y-4">
                <div className="flex justify-between items-center border-b pb-2">
                  <div className="font-bold text-base">{selectedStudent.name} 교육생 평가</div>
                  <button onClick={() => setSelectedStudent(null)} className="text-slate-400 font-bold">✕</button>
                </div>

                <div className="flex border-b text-xs font-bold">
                  <button onClick={() => setModalTab('myScore')} className={`flex-1 py-2 text-center border-b-2 ${modalTab === 'myScore' ? 'border-amber-500 text-amber-600' : 'text-slate-400'}`}>내 채점</button>
                  <button onClick={() => setModalTab('others')} className={`flex-1 py-2 text-center border-b-2 ${modalTab === 'others' ? 'border-amber-500 text-amber-600' : 'text-slate-400'}`}>다른 강사 평가</button>
                </div>

                {modalTab === 'myScore' ? (
                  <div className="space-y-4">
                    {CATEGORIES.map(cat => (
                      <div key={cat.id} className="bg-slate-50 p-3 rounded-xl space-y-1">
                        <div className="flex justify-between text-xs font-bold">
                          <span>{cat.icon} {cat.label}</span>
                          <span className="text-amber-600 font-black">{scores[cat.id]}점</span>
                        </div>
                        <input 
                          type="range" min="0" max="100" value={scores[cat.id]}
                          onChange={e => setScores({ ...scores, [cat.id]: parseInt(e.target.value) })}
                          className="w-full accent-amber-500"
                        />
                      </div>
                    ))}
                    <textarea 
                      placeholder="특이사항 및 메모..." 
                      value={note} 
                      onChange={e => setNote(e.target.value)}
                      className="w-full p-2.5 border rounded-xl text-xs" 
                      rows="3"
                    />
                    <button onClick={handleSaveEval} className="w-full bg-amber-500 text-white font-bold py-3 rounded-xl text-sm shadow">
                      평가 저장하기
                    </button>
                  </div>
                ) : (
                  <div className="space-y-2">
                    {Object.entries(evaluations[selectedStudent.id] || {}).map(([instName, ev]) => (
                      <div key={instName} className="bg-slate-50 p-3 rounded-xl text-xs space-y-1 border">
                        <div className="font-bold text-indigo-900">{instName} 강사</div>
                        <div className="flex justify-between text-slate-600">
                          <span>등반: {ev.scores.climbing}</span>
                          <span>하강: {ev.scores.rappelling}</span>
                          <span>빌레이: {ev.scores.belay}</span>
                        </div>
                        {ev.note && <div className="text-slate-500 italic mt-1 bg-white p-2 rounded border">"{ev.note}"</div>}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
