<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>등반 교육생 채점 및 관리 시스템</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; touch-action: pan-y; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SUPABASE_URL = 'https://rfcnyfdhtmjvkdcipger.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_0qx2MvW4AsHrQeHrK7OmzA_kcxFr9yi';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const EVAL_STRUCTURE = {
      climbing: {
        title: '🧗 1. 등반',
        subFields: [
          { key: 'climb_beltKnot', label: '벨트매듭', type: 'PF' },
          { key: 'climb_footWork', label: '발사용', type: 'HML' },
          { key: 'climb_handWork', label: '손사용', type: 'HML' },
          { key: 'climb_stability', label: '안정성', type: 'HML' },
          { key: 'climb_composure', label: '여유', type: 'HML' },
        ],
        resultKey: 'climbingResult'
      },
      secondBelay: {
        title: '⚓ 2. 세컨 빌레이',
        subFields: [
          { key: 'sb_anchorSetup', label: '지점 세팅', type: 'PF' },
          { key: 'sb_deviceSetup', label: '설치', type: 'PF' },
          { key: 'sb_ropePull', label: '줄당기기', type: 'PF' },
          { key: 'sb_ropeManage', label: '로프정리', type: 'PF' },
          { key: 'sb_lowering', label: '하강', type: 'PF' },
        ],
        resultKey: 'secondBelayResult'
      },
      leadBelay: {
        title: '🧗‍♂️ 3. 리딩빌레이',
        subFields: [
          { key: 'lb_deviceSetup', label: '디바이스 설치', type: 'PF' },
          { key: 'lb_shuffle', label: '셔플', type: 'PF' },
          { key: 'lb_brakeHand', label: '제동손 위치', type: 'PF' },
          { key: 'lb_stability', label: '안정성', type: 'HML' },
        ],
        resultKey: 'leadBelayResult'
      },
      rappelling: {
        title: '🪢 4. 하강',
        subFields: [
          { key: 'rp_ropeSetup', label: '로프설치', type: 'PF' },
          { key: 'rp_ropeFix', label: '로프고정', type: 'PF' },
          { key: 'rp_harnessConnect', label: '체결', type: 'PF' },
          { key: 'rp_stopCheck', label: '정지', type: 'PF' },
          { key: 'rp_ascending', label: '어센딩', type: 'PF' },
          { key: 'rp_proficiency', label: '능숙도', type: 'PF' },
        ],
        resultKey: 'rappellingResult'
      },
      walking: {
        title: '🥾 5. 보행',
        subFields: [],
        resultKey: 'walkingResult'
      }
    };

    const RATING_SCORES = { 'H': 3, 'M': 2, 'L': 1, 'P': 3, 'F': 1 };

    // 사전 등급 배지 렌더링 헬퍼 함수 (advance / inter / basic)
    const renderLevelBadge = (level) => {
      const lvl = (level || 'basic').toLowerCase();
      if (lvl === 'advance' || lvl === 'advanced') {
        return <span className="text-[10px] bg-purple-100 text-purple-800 border border-purple-300 px-1.5 py-0.5 rounded font-black">ADVANCE</span>;
      } else if (lvl === 'inter' || lvl === 'intermediate') {
        return <span className="text-[10px] bg-blue-100 text-blue-800 border border-blue-300 px-1.5 py-0.5 rounded font-black">INTER</span>;
      }
      return <span className="text-[10px] bg-slate-100 text-slate-700 border border-slate-300 px-1.5 py-0.5 rounded font-bold">BASIC</span>;
    };

    const getSurveyData = (student) => {
      if (!student || !student.student_surveys) return null;
      if (Array.isArray(student.student_surveys)) {
        return student.student_surveys[0] || null;
      }
      return student.student_surveys;
    };
    
    function App() {
      const [instructorName, setInstructorName] = useState(() => localStorage.getItem('instructorName') || '');
      const [isConfig, setIsConfig] = useState(!localStorage.getItem('instructorName'));
      const [tempName, setTempName] = useState('');
      
      const [activeTab, setActiveTab] = useState('allStudents');
      const [isMyGroupOpen, setIsMyGroupOpen] = useState(false); 
      
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);

      const [students, setStudents] = useState([]);
      const [groups, setGroups] = useState([]);
      const [instructorList, setInstructorList] = useState([]);
      const [groupInstructors, setGroupInstructors] = useState({});
      const [evaluations, setEvaluations] = useState({});

      const [searchQuery, setSearchQuery] = useState('');
      const [isAdminAuth, setIsAdminAuth] = useState(false);
      const [adminInput, setAdminInput] = useState('');
      const [editingGroups, setEditingGroups] = useState({});
      const [editingInstructors, setEditingInstructors] = useState({});

      const [selectedStudent, setSelectedStudent] = useState(null);
      const [modalTab, setModalTab] = useState('score'); 

      const [evalDetails, setEvalDetails] = useState({});
      const [evalResults, setEvalResults] = useState({});
      const [evalNote, setEvalNote] = useState('');

      const touchStartX = useRef(0);
      const touchEndX = useRef(0);

      const handleTouchStart = (e) => { touchStartX.current = e.targetTouches[0].clientX; };
      const handleTouchMove = (e) => { touchEndX.current = e.targetTouches[0].clientX; };
      const handleTouchEnd = () => {
        const distance = touchEndX.current - touchStartX.current;
        if (touchStartX.current > 0 && touchEndX.current > 0 && distance > 60) setIsMyGroupOpen(true);
        if (touchStartX.current > 0 && touchEndX.current > 0 && distance < -60) setIsMyGroupOpen(false);
        touchStartX.current = 0;
        touchEndX.current = 0;
      };

      const fetchData = async () => {
        setLoading(true);
        try {
          const { data: grpData } = await supabase.from('groups').select('*');
          if (grpData && grpData.length > 0) {
            const sortedGroups = grpData.map(g => g.name).sort((a, b) => (parseInt(a) || 0) - (parseInt(b) || 0));
            setGroups(sortedGroups);
          } else {
            setGroups(['1조', '2조', '3조', '4조', '5조', '6조', '7조', '8조', '9조']);
          }

          const { data: stdData, error: stdErr } = await supabase
            .from('students')
            .select('*, student_surveys!fk_student(*)');

          if (stdErr) throw stdErr;
          if (stdData) setStudents(stdData);
          
          const { data: instData } = await supabase.from('instructors').select('*');
          if (instData) setInstructorList(instData);

          const { data: gmData } = await supabase.from('group_managers').select('*');
          if (gmData) {
            const instMap = {};
            gmData.forEach(gm => {
              if (gm.group_name && gm.instructor_name) instMap[gm.group_name] = gm.instructor_name;
            });
            setGroupInstructors(instMap);
            setEditingInstructors(instMap);
          }

          const { data: evData } = await supabase.from('evaluations').select('*');
          if (evData) {
            const evMap = {};
            evData.forEach(ev => {
              if (!evMap[ev.student_id]) evMap[ev.student_id] = {};
              evMap[ev.student_id][ev.instructor_name] = {
                details: ev.details || {},
                results: ev.results || {},
                note: ev.note || '',
                updatedAt: ev.updated_at
              };
            });
            setEvaluations(evMap);
          }
        } catch (err) {
          console.error("데이터 로딩 오류:", err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => { fetchData(); }, []);

      const handleSaveInstructorName = async () => {
        if (!tempName.trim()) return alert('성함을 입력해주세요.');
        const name = tempName.trim();
        setInstructorName(name);
        localStorage.setItem('instructorName', name);

        try {
          await supabase.from('instructors').upsert({ name: name, last_login: new Date().toISOString() }, { onConflict: 'name' });
          fetchData();
        } catch (e) {
          console.error(e);
        }
        setIsConfig(false);
      };

      const handleOpenStudentModal = (student) => {
        setSelectedStudent(student);
        setModalTab('score');

        const existingEv = evaluations[student.id]?.[instructorName];
        if (existingEv) {
          setEvalDetails(existingEv.details || {});
          setEvalResults(existingEv.results || {});
          setEvalNote(existingEv.note || '');
        } else {
          setEvalDetails({});
          setEvalResults({});
          setEvalNote('');
        }
      };

      const handleSubFieldChange = (key, val) => {
        setEvalDetails(prev => ({ ...prev, [key]: val }));
      };

      const handleResultChange = (resKey, val) => {
        setEvalResults(prev => ({ ...prev, [resKey]: val }));
      };

      const handleManualSave = async () => {
        if (!selectedStudent || !instructorName) return;
        setSaving(true);

        const payload = {
          student_id: selectedStudent.id,
          instructor_name: instructorName,
          details: evalDetails,
          results: evalResults,
          note: evalNote,
          climbing_score: RATING_SCORES[evalResults.climbingResult] || 2,
          second_belay_score: RATING_SCORES[evalResults.secondBelayResult] || 2,
          leading_belay_score: RATING_SCORES[evalResults.leadBelayResult] || 2,
          rappelling_score: RATING_SCORES[evalResults.rappellingResult] || 2,
          walking_score: RATING_SCORES[evalResults.walkingResult] || 2,
          updated_at: new Date().toISOString()
        };

        try {
          const { error } = await supabase
            .from('evaluations')
            .upsert(payload, { onConflict: 'student_id,instructor_name' });

          if (error) throw error;

          setEvaluations(prev => ({
            ...prev,
            [selectedStudent.id]: {
              ...(prev[selectedStudent.id] || {}),
              [instructorName]: {
                details: evalDetails,
                results: evalResults,
                note: evalNote,
                updatedAt: payload.updated_at
              }
            }
          }));

          alert('평가가 성공적으로 저장되었습니다.');
          setSelectedStudent(null);
        } catch (err) {
          console.error("저장 실패:", err);
          alert('저장 실패: ' + err.message);
        } finally {
          setSaving(false);
        }
      };

      const handleAdminAuth = () => {
        if (adminInput === '1234') {
          setIsAdminAuth(true);
          const gMap = {};
          students.forEach(s => gMap[s.id] = s.group_name || '미정');
          setEditingGroups(gMap);
          setEditingInstructors({ ...groupInstructors });
        } else {
          alert('비밀번호가 올바르지 않습니다.');
        }
      };

      const handleSaveAdminData = async () => {
        try {
          for (const s of students) {
            const newGroup = editingGroups[s.id] || s.group_name;
            if (newGroup !== s.group_name) {
              const { error } = await supabase.from('students').update({ group_name: newGroup }).eq('id', s.id);
              if (error) throw error;
            }
          }

          for (const [g, instName] of Object.entries(editingInstructors)) {
            const { error } = await supabase.from('group_managers').upsert({ 
              group_name: g, 
              instructor_name: instName || null,
              updated_at: new Date().toISOString()
            }, { onConflict: 'group_name' });
            if (error) throw error;
          }

          alert('관리자 설정이 DB에 적용되었습니다.');
          fetchData();
        } catch (err) {
          alert('저장 실패: ' + err.message);
        }
      };

      const myAssignedGroups = groups.filter(g => groupInstructors[g] === instructorName);
      const filteredStudents = students.filter(s => s.name.toLowerCase().includes(searchQuery.toLowerCase().trim()));

      return (
        <div 
          className="max-w-md mx-auto bg-slate-100 min-h-screen pb-20 relative overflow-x-hidden"
          onTouchStart={handleTouchStart}
          onTouchMove={handleTouchMove}
          onTouchEnd={handleTouchEnd}
        >
          <header className="bg-slate-900 text-white p-4 sticky top-0 z-30 shadow-md">
            <div className="flex justify-between items-center">
              <div>
                <h1 className="font-extrabold text-base tracking-wide text-amber-400 flex items-center gap-1.5">
                  ⛰️ 등반 교육 평가 시스템
                  {loading && <span className="text-[10px] text-slate-400 font-normal animate-pulse">(동기화 중...)</span>}
                </h1>
                <p className="text-[10px] text-slate-400">👉 우측 스와이프: [내 담당 조] 확인</p>
              </div>
              <button 
                onClick={() => setIsConfig(true)}
                className="bg-slate-800 hover:bg-slate-700 text-xs px-2.5 py-1.5 rounded-lg border border-slate-700 font-medium text-slate-200"
              >
                👤 {instructorName || '강사 설정'}
              </button>
            </div>

            <div className="flex bg-slate-800 p-1 rounded-xl mt-3 text-xs font-bold">
              <button 
                onClick={() => setActiveTab('allStudents')}
                className={`flex-1 py-2 text-center rounded-lg transition-all ${activeTab === 'allStudents' ? 'bg-amber-500 text-slate-950 font-black shadow' : 'text-slate-400'}`}
              >
                교육생 리스트
              </button>
              <button 
                onClick={() => setActiveTab('allGroup')}
                className={`flex-1 py-2 text-center rounded-lg transition-all ${activeTab === 'allGroup' ? 'bg-amber-500 text-slate-950 font-black shadow' : 'text-slate-400'}`}
              >
                전체 조 평가
              </button>
              <button 
                onClick={() => setActiveTab('admin')}
                className={`flex-1 py-2 text-center rounded-lg transition-all ${activeTab === 'admin' ? 'bg-indigo-600 text-white font-black shadow' : 'text-slate-400'}`}
              >
                ⚙️ 관리자
              </button>
            </div>
          </header>

          <main className="p-4 space-y-4">
            {activeTab === 'allStudents' && (
              <div className="space-y-3">
                <div className="relative">
                  <input 
                    type="text" 
                    placeholder="🔍 교육생 이름 검색..." 
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                    className="w-full p-3 pl-10 bg-white border border-slate-300 rounded-2xl text-xs font-medium shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-400"
                  />
                  <span className="absolute left-3.5 top-3 text-slate-400 text-xs">🔎</span>
                </div>

                <div className="space-y-2.5">
                  {filteredStudents.length === 0 ? (
                    <div className="bg-white p-8 rounded-2xl text-center text-slate-400 text-xs border">
                      검색 결과가 없습니다.
                    </div>
                  ) : (
                    filteredStudents.map(s => {
                      const survey = getSurveyData(s);
                      const myEval = evaluations[s.id]?.[instructorName];

                      return (
                        <div 
                          key={s.id} 
                          onClick={() => handleOpenStudentModal(s)}
                          className="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between cursor-pointer hover:border-amber-400 transition-all active:scale-[0.99]"
                        >
                          <div className="flex items-center gap-3">
                            {s.photo_url ? (
                              <img src={s.photo_url} alt={s.name} className="w-12 h-12 rounded-xl object-cover border border-slate-100" />
                            ) : (
                              <div className="w-12 h-12 rounded-xl bg-slate-100 border flex items-center justify-center text-xl font-bold text-slate-400">
                                {s.name ? s.name[0] : '👤'}
                              </div>
                            )}

                            <div className="space-y-0.5">
                              <div className="flex items-center gap-1.5">
                                <span className="font-extrabold text-sm text-slate-800">{s.name}</span>
                                <span className="text-[10px] bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded font-bold">
                                  {s.group_name || '조 미정'}
                                </span>
                                {/* 사전 평가 등급 배지 추가 */}
                                {renderLevelBadge(s.level || survey?.level)}
                              </div>

                              <div className="text-[11px] text-slate-500">
                                {s.age ? `만 ${s.age}세` : '나이미상'} · {s.gender || '성별미상'}
                              </div>

                              <div className="text-[10px] text-slate-400 line-clamp-1">
                                🧗 경력: {survey?.climbing_exp || s.climbing_exp || '미입력'}
                              </div>
                            </div>
                          </div>

                          <div className="text-right flex flex-col items-end gap-1">
                            {myEval ? (
                              <span className="text-[10px] font-bold bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full">
                                채점완료 ✓
                              </span>
                            ) : (
                              <span className="text-[10px] font-bold bg-amber-50 text-amber-600 border border-amber-200 px-2 py-0.5 rounded-full">
                                채점대기
                              </span>
                            )}
                            <span className="text-slate-300 text-xs font-bold">&gt;</span>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            )}

            {activeTab === 'allGroup' && (
              <div className="space-y-4">
                {groups.map(grp => {
                  const groupStudents = students.filter(s => s.group_name === grp);
                  const assignedInst = groupInstructors[grp] || '미지정';

                  return (
                    <div key={grp} className="bg-white rounded-2xl p-4 border shadow-sm space-y-3">
                      <div className="flex justify-between items-center border-b pb-2">
                        <span className="font-extrabold text-slate-800 text-sm">
                          {grp} <span className="text-xs font-normal text-slate-500">(담당: {assignedInst})</span>
                        </span>
                        <span className="text-xs bg-slate-100 px-2 py-0.5 rounded-full text-slate-600 font-bold">
                          {groupStudents.length}명
                        </span>
                      </div>

                      <div className="space-y-2">
                        {groupStudents.map(s => {
                          const studentEvs = Object.entries(evaluations[s.id] || {});
                          const survey = getSurveyData(s);
                          return (
                            <div 
                              key={s.id}
                              onClick={() => handleOpenStudentModal(s)}
                              className="bg-slate-50 p-3 rounded-xl border space-y-2 cursor-pointer hover:bg-slate-100"
                            >
                              <div className="flex justify-between items-center">
                                <div className="flex items-center gap-1.5">
                                  <span className="font-bold text-sm text-slate-800">{s.name}</span>
                                  {renderLevelBadge(s.level || survey?.level)}
                                </div>
                                <span className="text-[11px] text-indigo-600 font-bold">평가 강사: {studentEvs.length}명</span>
                              </div>

                              {studentEvs.length > 0 && (
                                <div className="space-y-1 pt-1 border-t text-[11px]">
                                  {studentEvs.map(([inst, ev]) => (
                                    <div key={inst} className="flex justify-between items-center bg-white p-1.5 rounded border text-slate-700">
                                      <span className="font-bold">👤 {inst}</span>
                                      <div className="flex gap-1 text-[10px] font-bold">
                                        <span>등반:{ev.results?.climbingResult || '-'}</span>
                                        <span>세컨:{ev.results?.secondBelayResult || '-'}</span>
                                        <span>리딩:{ev.results?.leadBelayResult || '-'}</span>
                                        <span>하강:{ev.results?.rappellingResult || '-'}</span>
                                        <span>보행:{ev.results?.walkingResult || '-'}</span>
                                      </div>
                                    </div>
                                  ))}
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {activeTab === 'admin' && (
              <div className="space-y-4">
                {!isAdminAuth ? (
                  <div className="bg-white p-5 rounded-2xl border text-center space-y-3 shadow-sm">
                    <h3 className="font-bold text-sm text-slate-800">🔒 관리자 로그인</h3>
                    <input 
                      type="password" 
                      placeholder="비밀번호 입력 (1234)" 
                      value={adminInput}
                      onChange={e => setAdminInput(e.target.value)}
                      className="w-full p-2.5 border rounded-xl text-sm text-center"
                    />
                    <button onClick={handleAdminAuth} className="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-xl text-sm">
                      인증하기
                    </button>
                  </div>
                ) : (
                  <div className="space-y-5">
                    <div className="flex justify-between items-center border-b pb-2">
                      <h3 className="font-bold text-sm text-slate-800">⚙️ 관리자 조 편성 및 강사 매칭</h3>
                      <button onClick={handleSaveAdminData} className="bg-emerald-600 text-white font-bold text-xs px-3 py-2 rounded-xl shadow">
                        변경사항 DB 저장
                      </button>
                    </div>

                    <div className="bg-white p-3.5 rounded-xl border space-y-3 shadow-sm">
                      <div className="font-bold text-xs text-indigo-900 border-b pb-1">1. 조별 담당 강사 매칭</div>
                      <div className="space-y-2">
                        {groups.map(g => {
                          const currentSelectedInst = editingInstructors[g] || '';
                          const assignedInOtherGroups = Object.entries(editingInstructors)
                            .filter(([groupKey, instName]) => groupKey !== g && instName !== '')
                            .map(([, instName]) => instName);

                          const availableInstructors = instructorList.filter(inst => !assignedInOtherGroups.includes(inst.name));

                          return (
                            <div key={g} className="flex justify-between items-center bg-slate-50 p-2 rounded-lg border text-xs">
                              <span className="font-bold text-slate-700">{g}</span>
                              <select 
                                value={currentSelectedInst}
                                onChange={e => setEditingInstructors({ ...editingInstructors, [g]: e.target.value })}
                                className="p-1.5 border rounded-lg bg-white text-xs font-bold text-slate-800"
                              >
                                <option value="">미지정</option>
                                {availableInstructors.map(inst => (
                                  <option key={inst.name} value={inst.name}>{inst.name}</option>
                                ))}
                              </select>
                            </div>
                          );
                        })}
                      </div>
                    </div>

                    <div className="bg-white p-3.5 rounded-xl border space-y-3 shadow-sm">
                      <div className="font-bold text-xs text-indigo-900 border-b pb-1">2. 교육생 조 편성</div>
                      <div className="space-y-2">
                        {students.map((s, idx) => {
                          const survey = getSurveyData(s);
                          return (
                            <div key={s.id} className="bg-slate-50 p-2.5 rounded-xl border text-xs space-y-1.5">
                              <div className="flex justify-between items-center">
                                <div className="font-bold text-slate-900 flex items-center gap-1.5">
                                  <span>{s.name}</span>
                                  {renderLevelBadge(s.level || survey?.level)}
                                </div>
                                <select 
                                  value={editingGroups[s.id] || s.group_name || '미정'}
                                  onChange={e => setEditingGroups({ ...editingGroups, [s.id]: e.target.value })}
                                  className="p-1 border rounded bg-white text-xs font-bold text-indigo-700"
                                >
                                  <option value="미정">미정</option>
                                  {groups.map(g => (
                                    <option key={g} value={g}>{g}</option>
                                  ))}
                                </select>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* 내 담당 조 서랍(Drawer) */}
          <div className={`fixed inset-y-0 left-0 z-40 w-80 bg-white shadow-2xl transform transition-transform duration-300 ease-in-out border-r ${isMyGroupOpen ? 'translate-x-0' : '-translate-x-full'}`}>
            <div className="p-4 bg-slate-900 text-white flex justify-between items-center">
              <div>
                <h2 className="font-extrabold text-sm text-amber-400">🚩 내 담당 조 페이지</h2>
                <p className="text-[10px] text-slate-400">담당 강사: {instructorName || '미설정'}</p>
              </div>
              <button onClick={() => setIsMyGroupOpen(false)} className="text-slate-300 text-lg font-bold p-1">✕</button>
            </div>

            <div className="p-4 overflow-y-auto max-h-[calc(100vh-70px)] space-y-4">
              {myAssignedGroups.length === 0 ? (
                <div className="text-center py-12 space-y-2">
                  <div className="text-3xl">⚠️</div>
                  <div className="font-bold text-xs text-slate-700">담당 중인 조가 없습니다</div>
                  <p className="text-[11px] text-slate-400">관리자 탭에서 조 담당 강사로 지정해주세요.</p>
                </div>
              ) : (
                myAssignedGroups.map(grp => {
                  const groupStudents = students.filter(s => s.group_name === grp);
                  return (
                    <div key={grp} className="bg-slate-50 rounded-2xl p-3 border space-y-2">
                      <div className="flex justify-between items-center border-b pb-2">
                        <span className="font-bold text-xs text-slate-800">{grp}</span>
                        <span className="text-[10px] bg-slate-200 px-2 py-0.5 rounded-full font-bold">{groupStudents.length}명</span>
                      </div>

                      <div className="space-y-1.5">
                        {groupStudents.map(s => {
                          const survey = getSurveyData(s);
                          return (
                            <div 
                              key={s.id} 
                              onClick={() => {
                                handleOpenStudentModal(s);
                                setIsMyGroupOpen(false); 
                              }}
                              className="bg-white p-2.5 rounded-xl border flex items-center justify-between cursor-pointer hover:bg-amber-50/50"
                            >
                              <div className="flex items-center gap-2">
                                <div>
                                  <div className="font-bold text-xs text-slate-800 flex items-center gap-1">
                                    {s.name}
                                    {renderLevelBadge(s.level || survey?.level)}
                                  </div>
                                </div>
                              </div>
                              <span className="text-[10px] text-amber-600 font-bold">&gt;</span>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          </div>

          {selectedStudent && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-white rounded-t-3xl sm:rounded-2xl w-full max-w-md max-h-[90vh] overflow-y-auto p-5 space-y-4 shadow-2xl">
                
                <div className="flex justify-between items-center border-b pb-3">
                  <div className="flex items-center gap-3">
                    <div>
                      <h3 className="font-extrabold text-base text-slate-800 flex items-center gap-1.5">
                        {selectedStudent.name}
                        <span className="text-xs bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-md font-bold">
                          {selectedStudent.group_name || '미정'}
                        </span>
                      </h3>
                      <p className="text-xs text-slate-400">
                        {selectedStudent.age ? `만 ${selectedStudent.age}세` : '나이 미상'} | {selectedStudent.gender || '성별 미상'}
                      </p>
                    </div>
                  </div>
                  <button onClick={() => setSelectedStudent(null)} className="text-slate-400 text-xl font-bold p-1">✕</button>
                </div>

                {/* 채점 모달 내부 상단 요약 정보에 사전 등급 노출 */}
                <div className="bg-indigo-50/80 p-2.5 rounded-xl text-xs flex justify-between items-center border border-indigo-100">
                  <div className="flex items-center gap-1.5">
                    <span className="font-bold text-indigo-900">사전 등급:</span>
                    {renderLevelBadge(selectedStudent.level || getSurveyData(selectedStudent)?.level)}
                  </div>
                  <span className="text-[11px] text-indigo-700 font-medium">
                    경력: {getSurveyData(selectedStudent)?.climbing_exp || selectedStudent.climbing_exp || '미입력'}
                  </span>
                </div>

                <div className="flex border-b text-xs font-bold">
                  <button 
                    onClick={() => setModalTab('score')} 
                    className={`flex-1 py-2.5 text-center ${modalTab === 'score' ? 'border-b-2 border-amber-500 text-amber-600 font-extrabold' : 'text-slate-400'}`}
                  >
                    📝 평가 입력
                  </button>
                  <button 
                    onClick={() => setModalTab('survey')} 
                    className={`flex-1 py-2.5 text-center ${modalTab === 'survey' ? 'border-b-2 border-amber-500 text-amber-600 font-extrabold' : 'text-slate-400'}`}
                  >
                    📋 사전 설문
                  </button>
                </div>

                {modalTab === 'score' && (
                  <div className="space-y-4 pt-1">
                    {Object.entries(EVAL_STRUCTURE).map(([categoryKey, category]) => (
                      <div key={categoryKey} className="bg-slate-50 p-3.5 rounded-xl border space-y-3">
                        <div className="font-extrabold text-xs text-slate-900 border-b pb-1.5 flex justify-between items-center">
                          <span>{category.title}</span>
                          <span className="text-[10px] font-normal text-slate-400">결과 평가</span>
                        </div>

                        {category.subFields.length > 0 && (
                          <div className="space-y-2">
                            {category.subFields.map(sub => {
                              const val = evalDetails[sub.key] || '';
                              return (
                                <div key={sub.key} className="flex justify-between items-center text-xs">
                                  <span className="text-slate-600 font-medium">{sub.label}</span>
                                  {sub.type === 'PF' ? (
                                    <div className="flex gap-1">
                                      {['P', 'F'].map(opt => (
                                        <button
                                          key={opt}
                                          type="button"
                                          onClick={() => handleSubFieldChange(sub.key, opt)}
                                          className={`px-2.5 py-1 rounded text-[11px] font-bold border transition-all ${
                                            val === opt 
                                              ? (opt === 'P' ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-red-600 text-white border-red-600') 
                                              : 'bg-white text-slate-500 border-slate-200'
                                          }`}
                                        >
                                          {opt === 'P' ? 'Pass' : 'Fail'}
                                        </button>
                                      ))}
                                    </div>
                                  ) : (
                                    <div className="flex gap-1">
                                      {['L', 'M', 'H'].map(opt => (
                                        <button
                                          key={opt}
                                          type="button"
                                          onClick={() => handleSubFieldChange(sub.key, opt)}
                                          className={`px-2.5 py-1 rounded text-[11px] font-bold border transition-all ${
                                            val === opt ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-500 border-slate-200'
                                          }`}
                                        >
                                          {opt === 'L' ? '하' : opt === 'M' ? '중' : '상'}
                                        </button>
                                      ))}
                                    </div>
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        )}

                        <div className="pt-2 border-t flex justify-between items-center bg-amber-50/60 p-2 rounded-lg border border-amber-200">
                          <span className="text-xs font-bold text-amber-900">결과 (H / M / L)</span>
                          <div className="flex gap-1.5">
                            {['L', 'M', 'H'].map(resOpt => {
                              const isSelected = evalResults[category.resultKey] === resOpt;
                              return (
                                <button
                                  key={resOpt}
                                  type="button"
                                  onClick={() => handleResultChange(category.resultKey, resOpt)}
                                  className={`px-3 py-1 rounded-lg text-xs font-black border transition-all ${
                                    isSelected 
                                      ? 'bg-amber-500 text-slate-950 border-amber-600 shadow-sm scale-105' 
                                      : 'bg-white text-slate-600 border-slate-200'
                                  }`}
                                >
                                  {resOpt === 'L' ? '하(L)' : resOpt === 'M' ? '중(M)' : '상(H)'}
                                </button>
                              );
                            })}
                          </div>
                        </div>
                      </div>
                    ))}

                    <div>
                      <label className="text-xs font-bold text-slate-700 block mb-1">관찰 메모 & 특이사항</label>
                      <textarea 
                        rows="2" 
                        placeholder="특이사항이나 강점/보완점 입력..."
                        value={evalNote}
                        onChange={e => setEvalNote(e.target.value)}
                        className="w-full p-2.5 border rounded-xl text-xs bg-slate-50 focus:outline-none focus:ring-2 focus:ring-amber-500"
                      ></textarea>
                    </div>

                    <div className="flex justify-end gap-2 pt-3 border-t mt-4">
                      <button
                        type="button"
                        onClick={() => setSelectedStudent(null)}
                        className="px-4 py-2 bg-slate-200 text-slate-700 text-xs font-bold rounded-xl hover:bg-slate-300 transition-all"
                      >
                        취소
                      </button>
                      <button
                        type="button"
                        disabled={saving}
                        onClick={handleManualSave}
                        className="px-5 py-2 bg-blue-600 text-white text-xs font-bold rounded-xl hover:bg-blue-700 shadow-md transition-all flex items-center gap-1"
                      >
                        {saving ? '저장 중...' : '저장하기'}
                      </button>
                    </div>
                  </div>
                )}

                {modalTab === 'survey' && (
                  <div className="space-y-3 pt-1 text-xs">
                    {(() => {
                      const survey = getSurveyData(selectedStudent);
                      if (!survey) {
                        return (
                          <div className="text-center py-8 text-slate-400 bg-slate-50 rounded-xl border border-dashed">
                            등록된 사전 설문 데이터가 없습니다.
                          </div>
                        );
                      }
                      return (
                        <div className="space-y-2.5">
                          <div className="bg-slate-50 p-3 rounded-xl border space-y-1">
                            <span className="font-bold text-indigo-900">🧗‍♂️ 등반 경력</span>
                            <p className="text-slate-700 bg-white p-2 rounded border mt-0.5">
                              {survey.climbing_exp || '미입력'}
                            </p>
                          </div>
                        </div>
                      );
                    })()}
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
