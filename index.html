<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>등반 교육생 채점 및 관리 시스템</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; touch-action: pan-y; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SUPABASE_URL = 'https://rfcnyfdhtmjvkdcipger.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_0qx2MvW4AsHrQeHrK7OmzA_kcxFr9yi';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const EVAL_STRUCTURE = {
  climbing: {
    title: '🧗 1. 등반',
    subFields: [
      { key: 'climb_beltKnot', label: '벨트매듭', type: 'PF' },
      { key: 'climb_footWork', label: '발사용', type: 'HML' },
      { key: 'climb_handWork', label: '손사용', type: 'HML' },
      { key: 'climb_stability', label: '안정성', type: 'HML' },
      { key: 'climb_composure', label: '여유', type: 'HML' },
    ]
  },
  secondBelay: {
    title: '⚓ 2. 세컨 빌레이',
    subFields: [
      { key: 'sb_anchorSetup', label: '지점 세팅', type: 'PF' },
      { key: 'sb_deviceSetup', label: '설치', type: 'PF' },
      { key: 'sb_ropePull', label: '줄당기기', type: 'PF' },
      { key: 'sb_ropeManage', label: '로프정리', type: 'PF' },
      { key: 'sb_lowering', label: '하강', type: 'PF' },
    ]
  },
  leadBelay: {
    title: '🧗‍♂️ 3. 리딩빌레이',
    subFields: [
      { key: 'lb_deviceSetup', label: '디바이스 설치', type: 'PF' },
      { key: 'lb_shuffle', label: '셔플', type: 'PF' },
      { key: 'lb_brakeHand', label: '제동손 위치', type: 'PF' },
      { key: 'lb_stability', label: '안정성', type: 'HML' },
    ]
  },
  rappelling: {
    title: '🪢 4. 하강',
    subFields: [
      { key: 'rp_ropeSetup', label: '로프설치', type: 'PF' },
      { key: 'rp_ropeFix', label: '로프고정', type: 'PF' },
      { key: 'rp_harnessConnect', label: '체결', type: 'PF' },
      { key: 'rp_stopCheck', label: '정지', type: 'PF' },
      { key: 'rp_ascending', label: '어센딩', type: 'PF' },
      { key: 'rp_proficiency', label: '능숙도', type: 'PF' },
    ]
  },
  walking: {
    title: '🥾 5. 보행',
    subFields: [],
    resultKey: 'walkingResult' // 보행과목만 결과 선택 활성화
  }
};

const RATING_SCORES = { 'H': 3, 'M': 2, 'L': 1, 'P': 3, 'F': 1 };
    // 사전 등급 배지 렌더링 헬퍼 함수 (advance / inter / basic)
    const renderLevelBadge = (level) => {
      const lvl = (level || 'basic').toLowerCase();
      if (lvl === 'advance' || lvl === 'advanced') {
        return <span className="text-[10px] bg-purple-100 text-purple-800 border border-purple-300 px-1.5 py-0.5 rounded font-black">ADVANCE</span>;
      } else if (lvl === 'inter' || lvl === 'intermediate') {
        return <span className="text-[10px] bg-blue-100 text-blue-800 border border-blue-300 px-1.5 py-0.5 rounded font-black">INTER</span>;
      }
      return <span className="text-[10px] bg-slate-100 text-slate-700 border border-slate-300 px-1.5 py-0.5 rounded font-bold">BASIC</span>;
    };

    const getSurveyData = (student) => {
      if (!student || !student.student_surveys) return null;
      if (Array.isArray(student.student_surveys)) {
        return student.student_surveys[0] || null;
      }
      return student.student_surveys;
    };


    // 1. App 컴포넌트 맨 위(또는 App 바깥 상단)에 정의를 놓습니다.
const calculateGradeFromDetails = (details, keys) => {
  if (!details || !keys || keys.length === 0) return { grade: '-', score: 0 };

  let totalItems = 0;
  let passCount = 0;

  keys.forEach((key) => {
    const val = details[key];
    if (!val) return; // 평가되지 않은 항목 제외

    totalItems++;

    // Pass(P), 또는 H(상)/M(중) 항목을 Pass 성격으로 인정
    if (val === 'P' || val === 'Pass' || val === 'H' || val === 'M') {
      passCount++;
    }
  });

  // 평가된 항목이 없을 때
  if (totalItems === 0) return { grade: '-', score: 0 };

  // Pass 비율 계산 (0.0 ~ 1.0)
  const passRatio = passCount / totalItems;

  // 비율에 따른 결과 산출
  // 80% 이상 Pass -> 상(H) / 50% 이상 Pass -> 중(M) / 그 외 -> 하(L)
  if (passRatio >= 0.8) return { grade: 'H', score: 3 };
  if (passRatio >= 0.5) return { grade: 'M', score: 2 };
  return { grade: 'L', score: 1 };
};
    

const scoreToGrade = (score) => {
  const num = Number(score);
  if (num >= 2.5) return 'H';
  if (num >= 1.5) return 'M';
  if (num > 0) return 'L';
  return '-';
};

const CATEGORY_KEYS = {
  climbing: ['climb_beltKnot', 'climb_footWork', 'climb_handWork', 'climb_stability', 'climb_composure'],
  secondBelay: ['sb_anchorSetup', 'sb_deviceSetup', 'sb_ropePull', 'sb_ropeManage', 'sb_lowering'],
  leadBelay: ['lb_deviceSetup', 'lb_shuffle', 'lb_brakeHand', 'lb_stability'],
  rappelling: ['rp_ropeSetup', 'rp_ropeFix', 'rp_harnessConnect', 'rp_stopCheck', 'rp_ascending', 'rp_proficiency'],
};

    
    function App() {
      const [instructorName, setInstructorName] = useState(() => localStorage.getItem('instructorName') || '');
      const [isConfig, setIsConfig] = useState(!localStorage.getItem('instructorName'));
      const [tempName, setTempName] = useState('');
      
      const [activeTab, setActiveTab] = useState('allStudents');
      const [isMyGroupOpen, setIsMyGroupOpen] = useState(false); 
      
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);

      const [students, setStudents] = useState([]);
      const [groups, setGroups] = useState([]);
      const [instructorList, setInstructorList] = useState([]);
      const [groupInstructors, setGroupInstructors] = useState({});
      const [evaluations, setEvaluations] = useState({});

      const [searchQuery, setSearchQuery] = useState('');
      const [isAdminAuth, setIsAdminAuth] = useState(false);
      const [adminInput, setAdminInput] = useState('');
      const [editingGroups, setEditingGroups] = useState({});
      const [editingInstructors, setEditingInstructors] = useState({});

      const [selectedStudent, setSelectedStudent] = useState(null);
      const [modalTab, setModalTab] = useState('score'); 

      const [evalDetails, setEvalDetails] = useState({});
      const [evalResults, setEvalResults] = useState({});
      const [evalNote, setEvalNote] = useState('');

      const touchStartX = useRef(0);
      const touchEndX = useRef(0);

      const handleTouchStart = (e) => { touchStartX.current = e.targetTouches[0].clientX; };
      const handleTouchMove = (e) => { touchEndX.current = e.targetTouches[0].clientX; };
      const handleTouchEnd = () => {
        const distance = touchEndX.current - touchStartX.current;
        if (touchStartX.current > 0 && touchEndX.current > 0 && distance > 60) setIsMyGroupOpen(true);
        if (touchStartX.current > 0 && touchEndX.current > 0 && distance < -60) setIsMyGroupOpen(false);
        touchStartX.current = 0;
        touchEndX.current = 0;
      };

      const fetchData = async () => {
        setLoading(true);
        try {
          const { data: grpData } = await supabase.from('groups').select('*');
          if (grpData && grpData.length > 0) {
            const sortedGroups = grpData.map(g => g.name).sort((a, b) => (parseInt(a) || 0) - (parseInt(b) || 0));
            setGroups(sortedGroups);
          } else {
            setGroups(['1조', '2조', '3조', '4조', '5조', '6조', '7조', '8조', '9조']);
          }

          const { data: stdData, error: stdErr } = await supabase
            .from('students')
            .select('*, student_surveys!fk_student(*)');

          if (stdErr) throw stdErr;
          if (stdData) setStudents(stdData);
          
          const { data: instData } = await supabase.from('instructors').select('*');
          if (instData) setInstructorList(instData);

          const { data: gmData } = await supabase.from('group_managers').select('*');
          if (gmData) {
            const instMap = {};
            gmData.forEach(gm => {
              if (gm.group_name && gm.instructor_name) instMap[gm.group_name] = gm.instructor_name;
            });
            setGroupInstructors(instMap);
            setEditingInstructors(instMap);
          }

          const { data: evData } = await supabase.from('evaluations').select('*');
          if (evData) {
            const evMap = {};
            evData.forEach(ev => {
              if (!evMap[ev.student_id]) evMap[ev.student_id] = {};
              evMap[ev.student_id][ev.instructor_name] = {
                details: ev.details || {},
                results: ev.results || {},
                note: ev.note || '',
                updatedAt: ev.updated_at
              };
            });
            setEvaluations(evMap);
          }
        } catch (err) {
          console.error("데이터 로딩 오류:", err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => { fetchData(); }, []);

      const handleSaveInstructorName = async () => {
        if (!tempName.trim()) return alert('성함을 입력해주세요.');
        const name = tempName.trim();
        setInstructorName(name);
        localStorage.setItem('instructorName', name);

        try {
          await supabase.from('instructors').upsert({ name: name, last_login: new Date().toISOString() }, { onConflict: 'name' });
          fetchData();
        } catch (e) {
          console.error(e);
        }
        setIsConfig(false);
      };

      const handleOpenStudentModal = (student) => {
        setSelectedStudent(student);
        setModalTab('score');

        const existingEv = evaluations[student.id]?.[instructorName];
        if (existingEv) {
          setEvalDetails(existingEv.details || {});
          setEvalResults(existingEv.results || {});
          setEvalNote(existingEv.note || '');
        } else {
          setEvalDetails({});
          setEvalResults({});
          setEvalNote('');
        }
      };

      const handleSubFieldChange = (key, val) => {
        setEvalDetails(prev => ({ ...prev, [key]: val }));
      };

      const handleResultChange = (resKey, val) => {
        setEvalResults(prev => ({ ...prev, [resKey]: val }));
      };

      const handleManualSave = async () => {
        if (!selectedStudent || !instructorName) return;
        setSaving(true);

        const payload = {
          student_id: selectedStudent.id,
          instructor_name: instructorName,
          details: evalDetails,
          results: evalResults,
          note: evalNote,
          climbing_score: RATING_SCORES[evalResults.climbingResult] || 2,
          second_belay_score: RATING_SCORES[evalResults.secondBelayResult] || 2,
          leading_belay_score: RATING_SCORES[evalResults.leadBelayResult] || 2,
          rappelling_score: RATING_SCORES[evalResults.rappellingResult] || 2,
          walking_score: RATING_SCORES[evalResults.walkingResult] || 2,
          updated_at: new Date().toISOString()
        };

        try {
          const { error } = await supabase
            .from('evaluations')
            .upsert(payload, { onConflict: 'student_id,instructor_name' });

          if (error) throw error;

          setEvaluations(prev => ({
            ...prev,
            [selectedStudent.id]: {
              ...(prev[selectedStudent.id] || {}),
              [instructorName]: {
                details: evalDetails,
                results: evalResults,
                note: evalNote,
                updatedAt: payload.updated_at
              }
            }
          }));

          alert('평가가 성공적으로 저장되었습니다.');
          setSelectedStudent(null);
        } catch (err) {
          console.error("저장 실패:", err);
          alert('저장 실패: ' + err.message);
        } finally {
          setSaving(false);
        }
      };

      
      const handleAdminAuth = () => {
        if (adminInput === '1234') {
          setIsAdminAuth(true);
          const gMap = {};
          students.forEach(s => gMap[s.id] = s.group_name || '미정');
          setEditingGroups(gMap);
          setEditingInstructors({ ...groupInstructors });
        } else {
          alert('비밀번호가 올바르지 않습니다.');
        }
      };

      const handleSaveAdminData = async () => {
        try {
          for (const s of students) {
            const newGroup = editingGroups[s.id] || s.group_name;
            if (newGroup !== s.group_name) {
              const { error } = await supabase.from('students').update({ group_name: newGroup }).eq('id', s.id);
              if (error) throw error;
            }
          }

          for (const [g, instName] of Object.entries(editingInstructors)) {
            const { error } = await supabase.from('group_managers').upsert({ 
              group_name: g, 
              instructor_name: instName || null,
              updated_at: new Date().toISOString()
            }, { onConflict: 'group_name' });
            if (error) throw error;
          }

          alert('관리자 설정이 DB에 적용되었습니다.');
          fetchData();
        } catch (err) {
          alert('저장 실패: ' + err.message);
        }
      };

      const myAssignedGroups = groups.filter(g => groupInstructors[g] === instructorName);
      const filteredStudents = students.filter(s => s.name.toLowerCase().includes(searchQuery.toLowerCase().trim()));



      const handleSaveGroupInstructor = async (groupName, instName) => {
  try {
    const { error } = await supabase.from('group_managers').upsert({
      group_name: groupName,
      instructor_name: instName || null,
      updated_at: new Date().toISOString()
    }, { onConflict: 'group_name' });

    if (error) throw error;
    setGroupInstructors(prev => ({ ...prev, [groupName]: instName }));
  } catch (err) {
    console.error("강사 배정 저장 실패:", err);
  }
};

      

      const rankedStudents = students
  .map((student) => {
    const evalData = evaluations[student.id] || evaluations[student.student_id];
    const studentEvals = Array.isArray(evalData)
      ? evalData
      : Object.values(evalData || {});

    if (!studentEvals || studentEvals.length === 0) {
      return {
        ...student,
        grades: { climbing: '-', secondBelay: '-', leadingBelay: '-', rappelling: '-', walking: '-' },
        totalScore: 0,
        evalCount: 0,
      };
    }

    const count = studentEvals.length;

    // 각 강사의 평가 건별로 P/F 비율에 따른 점수 산출
    let sumClimbing = 0, sumSecond = 0, sumLeading = 0, sumRappelling = 0, sumWalking = 0;

    studentEvals.forEach((evalItem) => {
      const details = evalItem.details || {};

      sumClimbing += calculateGradeFromDetails(details, CATEGORY_KEYS.climbing).score;
      sumSecond += calculateGradeFromDetails(details, CATEGORY_KEYS.secondBelay).score;
      sumLeading += calculateGradeFromDetails(details, CATEGORY_KEYS.leadingBelay).score;
      sumRappelling += calculateGradeFromDetails(details, CATEGORY_KEYS.rappelling).score;

      // 보행은 DB의 walking_score (3: H, 2: M, 1: L) 값 사용
      sumWalking += Number(evalItem.walking_score) || 1;
    });

    const avgClimbing = (sumClimbing / count).toFixed(1);
    const avgSecond = (sumSecond / count).toFixed(1);
    const avgLeading = (sumLeading / count).toFixed(1);
    const avgRappelling = (sumRappelling / count).toFixed(1);
    const avgWalking = (sumWalking / count).toFixed(1);

    const totalScore = Number(
      ((Number(avgClimbing) + Number(avgSecond) + Number(avgLeading) + Number(avgRappelling) + Number(avgWalking)) / 5).toFixed(1)
    );

    return {
      ...student,
      // 관리자 화면 표기용 파트별 H/M/L 등급
      grades: {
        climbing: scoreToGrade(avgClimbing),
        secondBelay: scoreToGrade(avgSecond),
        leadingBelay: scoreToGrade(avgLeading),
        rappelling: scoreToGrade(avgRappelling),
        walking: scoreToGrade(avgWalking),
      },
      totalScore,
      evalCount: count,
    };
  })
  .sort((a, b) => b.totalScore - a.totalScore);

      
     return (
  <div 
    className="max-w-md mx-auto bg-slate-100 min-h-screen pb-20 relative overflow-x-hidden"
    onTouchStart={handleTouchStart}
    onTouchMove={handleTouchMove}
    onTouchEnd={handleTouchEnd}
  >
    <header className="bg-slate-900 text-white p-4 sticky top-0 z-30 shadow-md">
      <div className="flex justify-between items-center">
        <div>
          <h1 className="font-extrabold text-base tracking-wide text-amber-400 flex items-center gap-1.5">
            ⛰️ 등반 교육 평가 시스템
            {loading && <span className="text-[10px] text-slate-400 font-normal animate-pulse">(동기화 중...)</span>}
          </h1>
          <p className="text-[10px] text-slate-400">👉 우측 스와이프: [내 담당 조] 확인</p>
        </div>
        <button 
          onClick={() => {
            setTempName(instructorName); // 모달 열 때 현재 이름으로 임시값 초기화
            setIsConfig(true);
          }}
          className="bg-slate-800 hover:bg-slate-700 text-xs px-2.5 py-1.5 rounded-lg border border-slate-700 font-medium text-slate-200"
        >
          👤 {instructorName || '강사 설정'}
        </button>
      </div>

      <div className="flex bg-slate-800 p-1 rounded-xl mt-3 text-xs font-bold">
        <button 
          onClick={() => setActiveTab('allStudents')}
          className={`flex-1 py-2 text-center rounded-lg transition-all ${activeTab === 'allStudents' ? 'bg-amber-500 text-slate-950 font-black shadow' : 'text-slate-400'}`}
        >
          교육생 리스트
        </button>
        
              <button 
                onClick={() => setActiveTab('allGroup')}
                className={`flex-1 py-2 text-center rounded-lg transition-all ${activeTab === 'allGroup' ? 'bg-amber-500 text-slate-950 font-black shadow' : 'text-slate-400'}`}
              >
                전체 조 평가
              </button>
              <button 
                onClick={() => setActiveTab('admin')}
                className={`flex-1 py-2 text-center rounded-lg transition-all ${activeTab === 'admin' ? 'bg-indigo-600 text-white font-black shadow' : 'text-slate-400'}`}
              >
                ⚙️ 관리자
              </button>
            </div>
          </header>

    {/* 💡 강사 설정 모달 (isConfig가 true일 때 표시) */}
    {isConfig && (
      <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
        <div className="bg-white rounded-2xl p-6 w-full max-w-xs space-y-4 shadow-2xl text-slate-800">
          <div>
            <h3 className="text-base font-extrabold text-slate-900">👤 강사 이름 설정</h3>
            <p className="text-xs text-slate-500 mt-0.5">평가 내역에 기록될 본인의 이름을 입력해 주세요.</p>
          </div>

          <input
            type="text"
            value={tempName}
            onChange={(e) => setTempName(e.target.value)}
            placeholder="예: 배서영"
            className="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
            autoFocus
          />

          <div className="flex gap-2 pt-1">
            {/* 이미 강사명이 설정되어 있던 경우에만 취소 버튼 노출 */}
            {instructorName && (
              <button
                onClick={() => setIsConfig(false)}
                className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2.5 rounded-xl text-xs font-bold transition-colors"
              >
                취소
              </button>
            )}
            <button
              onClick={() => {
                if (!tempName.trim()) {
                  alert('강사 이름을 입력해주세요.');
                  return;
                }
                const name = tempName.trim();
                localStorage.setItem('instructorName', name);
                setInstructorName(name);
                setIsConfig(false);
              }}
              className="flex-1 bg-amber-500 hover:bg-amber-600 text-white py-2.5 rounded-xl text-xs font-bold transition-colors shadow-md"
            >
              저장하기
            </button>
          </div>
        </div>
      </div>
    )}

          <main className="p-4 space-y-4">
            {activeTab === 'allStudents' && (
              <div className="space-y-3">
                <div className="relative">
                  <input 
                    type="text" 
                    placeholder="🔍 교육생 이름 검색..." 
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                    className="w-full p-3 pl-10 bg-white border border-slate-300 rounded-2xl text-xs font-medium shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-400"
                  />
                  <span className="absolute left-3.5 top-3 text-slate-400 text-xs">🔎</span>
                </div>

                <div className="space-y-2.5">
                  {filteredStudents.length === 0 ? (
                    <div className="bg-white p-8 rounded-2xl text-center text-slate-400 text-xs border">
                      검색 결과가 없습니다.
                    </div>
                  ) : (
                    filteredStudents.map(s => {
                      const survey = getSurveyData(s);
                      const myEval = evaluations[s.id]?.[instructorName];

                      return (
                        <div 
                          key={s.id} 
                          onClick={() => handleOpenStudentModal(s)}

    let passCount = 0;
    keys.forEach((key) => {
      if (details[key] === 'P' || details[key] === 'Pass') passCount++;
    });
    const passRatio = passCount / keys.length;
    if (passRatio >= 0.8) return { grade: 'H', score: 3 };
    if (passRatio >= 0.5) return { grade: 'M', score: 2 };
    return { grade: 'L', score: 1 };

    if (num > 0) return 'L';
    return '-';

    secondBelay: ['sb_anchor', 'sb_install', 'sb_ropePull', 'sb_ropeSort', 'sb_lowering'],
    leadingBelay: ['lb_device', 'lb_shuffle', 'lb_handPos', 'lb_stability'],

        sumLeading += calculateGradeFromDetails(details, CATEGORY_KEYS.leadingBelay).score;

            <span className="font-bold text-indigo-900">🚶‍♂️ 걷기 능력</span>
            <p className="text-slate-700 bg-white p-2 rounded border mt-0.5">
              {survey.walking_skill || '미입력'}
            </p>
          </div>

          {/* 참여 목적 */}
          <div className="bg-slate-50 p-3 rounded-xl border space-y-1">
            <span className="font-bold text-indigo-900">🎯 참여 목적</span>
            <p className="text-slate-700 bg-white p-2 rounded border mt-0.5">
              {survey.purpose || '미입력'}
            </p>
          </div>

          {/* 학습자 상태 / 특이사항 */}
          <div className="bg-slate-50 p-3 rounded-xl border space-y-1">
            <span className="font-bold text-indigo-900">⚠️ 학습자 상태 및 특이사항</span>
            <p className="text-slate-700 bg-white p-2 rounded border mt-0.5">
              {survey.learner_status || '미입력'}
            </p>
          </div>
        </div>
      );
    })()}
  </div>
)}
                
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
